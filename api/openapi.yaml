  /v1/backup:
    get:
      tags: [Backup]
      operationId: getBackup
      x-directorlink-role: admin
      summary: Everything DirectorLink keeps, as one document
      description: |
        Keys (their hashes and lock keys, never a key), profiles, room names and the room order,
        scenes, schedules (without what they ran), the calendar's settings, the home's remote
        identity (only one the relay has accepted, marked `linked`; none is made for a backup) and
        the rooms an admin chose for Sonos players (1.6.0), one section per store as the store
        keeps it; how DirectorLink's Composer properties are set
        (listed when restoring, never restored); the names of the rooms and devices the sections
        refer to, so that a restore can match a project whose ids changed; and which controller
        made it (`controller_id`). Pending invitations are not in it.

        Only in sealed requests (`POST /v1/sealed` on the home network, and through remote access):
        a request with `Authorization: Bearer` gets 403 `SEALED_REQUEST_REQUIRED`. The DirectorLink
        app encrypts the document with a password before it is saved (docs/BACKUP.md).
      responses:
        "200":
          description: The backup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/restore/parts:
    post:
      tags: [Backup]
      operationId: sendRestorePart
      x-directorlink-role: admin
      summary: Send a backup back, in parts
      description: |
        A backup's JSON text, cut into parts that each fit in a sealed request (at most 48 KiB of
        text; 2 MiB and 100 parts in all). The first part (`index` 0, no `upload`) starts an upload
        and replaces the key's own one before; the answer's `upload` goes with the next ones, in
        order. Once `complete`, check it and restore it with `POST /v1/restore`. An upload belongs
        to the key that sent it, one per key and three in all (a fourth replaces the one used
        longest ago), and is dropped 10 minutes after its last use. Sealed requests only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestorePart"
      responses:
        "200":
          description: The part was received.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestorePartReceived"
        "400":
          description: The part is not the next one, or too large (`INVALID_FIELD`), or the upload would pass 2 MiB (`BACKUP_TOO_LARGE`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No upload with this id is waiting for this key (`UPLOAD_NOT_FOUND`); send the backup again from its first part.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/restore:
    post:
      tags: [Backup]
      operationId: restoreBackup
      x-directorlink-role: admin
      summary: Check a backup, or restore it
      description: |
        With `dry_run` true (the default) the backup is checked against this controller and nothing
        changes: the answer is what a restore would do. With `dry_run` false everything DirectorLink
        keeps is replaced by the backup, every store or none (if one cannot be saved, the others get
        their values from before: 500 `RESTORE_FAILED`).

        The backup is an `upload` sent with `POST /v1/restore/parts`, or a `document` in this
        request. A backup made by a newer DirectorLink than this one is refused (409
        `BACKUP_TOO_NEW`); older ones are read as an update reads their stores.

        What a restore does besides (ADR-042):
        - Keys: the backup's come back only when no key but the sender's is paired, and the
          sender's was paired after the backup was made (the driver was added again):
          `keys.action` `restore`, with `keys.items`. Otherwise every key stays as it is now
          (`kept`): no key revoked or demoted since comes back. The sender's key stays as it is
          now, added if the backup does not have it (its profile too), even past the 20 keys; with
          `replaces_key` it takes the place of one of the backup's keys (that key's profile and
          role; the key itself stays out). Keys whose expiry has passed, or that have more than 30
          days and an hour left, stay out, as do key records a driver would not make.
        - Rooms and devices are matched to the project: the same id with the same name; else the
          one other room, or device of the kind in the same room, with that name (ids swapped);
          else the same id renamed. Doors and gates only with the same id and name, never moved.
          What matches nothing is left out and listed in `references.unmatched`.
        - A schedule starts as if saved at the restore (nothing due before runs; a weather rule
          waits until the weather has turned). Pending invitations are revoked.
        - `origin` says whether the backup looks like another home's (another home id, another
          controller, another name, or most of what it refers to not in this project). The
          remote identity: the same home keeps the one in use; the backup's is used from a few
          seconds after the answer (if the relay refuses it the controller's own comes back), but
          another home's only with `move_remote`.
        - Composer properties are never restored: `composer` lists them.

        Sealed requests only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreRequest"
      responses:
        "200":
          description: Checked (`dry_run` true), or restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No upload with this id is waiting for this key (`UPLOAD_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The backup was made by a newer DirectorLink (`BACKUP_TOO_NEW`), the upload has parts still to come (`UPLOAD_INCOMPLETE`), `replaces_key` was sent while the keys are kept (`KEYS_KEPT`), or it would leave no admin (`LAST_ADMIN`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: This is not a DirectorLink backup, or a section is missing or not valid (`BACKUP_INVALID`, with `errors`). Nothing was changed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: A store could not be saved; every store has its values from before (`RESTORE_FAILED`, with `store`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: DirectorLink has not read the project yet (`PROJECT_NOT_READY`), or could not read one of its stores when it started (`UNAVAILABLE`, with `store`; a restore would overwrite it; restart the driver).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/activity:
    get:
      tags: [Activity]
      operationId: listActivity
      x-directorlink-role: admin
      summary: Read the controller's activity history
      description: |
        Newest first. Each entry says when, who (a key's device and person, a schedule, Composer or
        DirectorLink itself), what by the names the controller had then, and how it went. Ask for
        the entries before the last one received with `before` (the answer's `next_before`). Like
        the log it may be read in the clear; the app sends it sealed.
      parameters:
        - name: kind
          in: query
          description: Only entries of these kinds, separated by commas, e.g. `scene,schedule`.
          schema:
            type: string
            example: scene,schedule
        - name: before
          in: query
          description: Only entries recorded before the entry with this id (the previous answer's `next_before`).
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          description: Maximum number of entries.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Matching entries, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/alerts/choices:
    get:
      tags: [Alerts]
      operationId: getAlertChoices
      x-directorlink-role: member
      summary: This key's alert choices
      description: |
        Whether this key's device switched alerts on, and which of the kinds its role may get, of
        those this home has, it wants. Until it chooses: every kind but `door_opened` and `camera`. A
        doorbell goes to every role, `camera` (1.8.0) to the keys that may see that camera's pictures,
        `fridge_door` to members and up, `door_opened` and `schedule_failed` to admins.
      responses:
        "200":
          description: This key's choices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertChoices"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Alerts]
      operationId: setAlertChoices
      x-directorlink-role: member
      summary: Change this key's alert choices
      description: |
        `on` when its device switches alerts on or off (the app also registers the browser with the
        account service), `kinds` for what it wants; what is left out stays as it was. A kind its
        role may not get is not kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertChoicesUpdate"
      responses:
        "200":
          description: Changed; this key's choices now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertChoices"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/backup/automatic:
    get:
      tags: [Backup]
      operationId: getAutomaticBackup
      x-directorlink-role: admin
      summary: Automatic backups to the account
      description: |
        Whether automatic backups are on (1.6.0, ADR-048): the backup password's key, the
        controller's time they are made at (the home's own minute between 03:00 and 04:59), whether
        one is being made, how the last one went, and whether remote access can take them now. The
        password itself is never on the controller. The key's public key, salt and iterations, as
        the app set them, are in sealed requests only: with them a guessed password can be checked
        offline. In the clear (a Bearer key) the key has its `key_id` and `set_at` only.
      responses:
        "200":
          description: How automatic backups are set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomaticBackup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Backup]
      operationId: setAutomaticBackup
      x-directorlink-role: admin
      summary: Set the backup password's key
      description: |
        Turns automatic backups on, or changes the backup password: the X25519 public key the app
        made from the password with PBKDF2-SHA-256, the salt and the iterations. Each day's backup
        is sealed to this key, so only someone who types the password can open it; backups made
        before a change still need the password they were made with. Sealed requests only, so that
        nobody on the network can put their own key in its place.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomaticBackupKey"
      responses:
        "200":
          description: Set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomaticBackup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Backup]
      operationId: turnOffAutomaticBackup
      x-directorlink-role: admin
      summary: Turn automatic backups off
      description: The key goes; no more backups are made. The backups in the account stay until they are deleted there. Sealed requests only.
      responses:
        "204":
          description: Turned off.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/backup/automatic/run:
    post:
      tags: [Backup]
      operationId: runAutomaticBackup
      x-directorlink-role: admin
      summary: Back up now
      description: |
        Starts a backup to the account now; `GET /v1/backup/automatic` says when it is done
        (`running`, `last`). The account keeps one a day, the newest.
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema:
                type: object
                required: [started, status]
                properties:
                  started:
                    const: true
                  status:
                    $ref: "#/components/schemas/AutomaticBackup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Automatic backups are off (`AUTOMATIC_BACKUP_OFF`), one is being made (`BACKUP_RUNNING`), Remote Access is off (`REMOTE_ACCESS_OFF`) or the relay has not accepted the home yet (`HOME_NOT_LINKED`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Not connected to the relay now (`REMOTE_OFFLINE`), the lock failed its self-test (`LOCK_UNAVAILABLE`), or the project is not read yet (`PROJECT_NOT_READY`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/logs:
    get:
      tags: [Logs]
      operationId: listLogs
      x-directorlink-role: admin
      summary: Read the bridge's recent log
      description: |
        The bridge keeps its last 500 log entries in memory: API requests, commands sent to
        devices, state changes and errors. Poll with `after` set to the last `seq` you received
        to get only new entries.
      parameters:
        - name: level
          in: query
          description: Minimum level to return.
          schema:
            $ref: "#/components/schemas/LogLevel"
        - name: category
          in: query
          description: Only entries of this category, e.g. `api`, `light`, `thermostat`, `auth`.
          schema:
            type: string
        - name: after
          in: query
          description: Only entries with a sequence number greater than this.
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          description: Maximum number of entries (the newest ones are kept).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        "200":
          description: Matching entries, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/logs/settings:
    get:
      tags: [Logs]
      operationId: getLogSettings
      x-directorlink-role: admin
      summary: Get the log level
      responses:
        "200":
          description: The level entries are currently recorded at.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [Logs]
      operationId: updateLogSettings
      x-directorlink-role: admin
      summary: Change the log level
      description: Use `debug` while investigating a problem, then set it back to `info`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogSettings"
            example:
              level: debug
      responses:
        "200":
          description: The new settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: "Send `Authorization: Bearer <api key>`. Get a key with `POST /v1/auth/pair`."

  parameters:
    RoomIdQuery:
      name: room_id
      in: query
      description: Only items in this room.
      schema:
        type: integer
        minimum: 1
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{8}$"
    SceneId:
      name: sceneId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{8}$"
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{8}$"
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    LightId:
      name: lightId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    DoorbellId:
      name: doorbellId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    RefrigeratorId:
      name: refrigeratorId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    RelayId:
      name: relayId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CameraId:
      name: cameraId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    BlindId:
      name: blindId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ThermostatId:
      name: thermostatId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    FanId:
      name: fanId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    KeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{8}$"
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{8}$"
    MusicId:
      name: musicId
      in: path
      required: true
      description: A Sonos room's `id`, as `GET /v1/music` lists it (never an address).
      schema:
        type: string
        pattern: "^RINCON_[0-9A-Fa-f]+$"
        maxLength: 40

  headers:
    RetryAfter:
      description: Seconds to wait before trying again.
      schema:
        type: integer

  responses:
    BadRequest:
      description: The request is invalid (`INVALID_REQUEST`, `INVALID_FIELD`, `INVALID_PARAMETER`, `INVALID_JSON`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: The API key is missing, wrong or revoked (`UNAUTHORIZED`), or it expired and was removed (`KEY_EXPIRED`, ADR-040).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist (`NOT_FOUND`), or a Sonos room plays nothing with a picture (`NO_ART`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with what the device supports or with current limits (`NOT_SUPPORTED`, `MODE_NOT_SUPPORTED`, `POSITION_NOT_SUPPORTED`, `STOP_NOT_SUPPORTED`, `FEATURE_NOT_SUPPORTED`, `HOLD_NOT_ALLOWED`, `KEY_LIMIT_REACHED`, `REMOTE_ACCESS_OFF`, `INVITATION_LIMIT_REACHED`, `SCENE_LIMIT_REACHED`, `SCENE_IN_USE`, `SCHEDULE_LIMIT_REACHED`, `VERSION_CONFLICT`, `LIMIT_REACHED`, `ASK_LINK_LIMIT_REACHED`, `USER_DEVICE_LIMIT` (since 1.9.0 a user has at most five devices; with `limit`, `user` and, for a caller who sees that user, `devices`), `SUGGESTION_CHANGED` (a suggestion to make devices of one account one user changed since it was shown, 1.9.0), `ALREADY_OWNER`, `NOT_AN_ADMIN`, `OWNER_NEEDS_ACCOUNT`, `OWNER_ACCOUNT_UNCLEAR`, `OWNER_ACCOUNT_SHARED` (making another admin the owner, 1.9.0, ADR-064, with `user`, and `device_names` for the last two); an open request that is over, `OPEN_REQUEST_EXPIRED`, or answered, `OPEN_REQUEST_ANSWERED`), a Sonos player refused it (`ACTION_NOT_POSSIBLE`, `FAVORITE_NOT_PLAYABLE`), or it needs something an installer switches on in Composer (`JEWISH_CALENDAR_OFF`, while DirectorLink's Jewish Calendar property is Off; `SONOS_OFF`, while its Sonos property is Off).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Too many failed attempts (`PAIRING_RATE_LIMITED`).
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CommandFailed:
      description: The controller or device failed the request (`CONTROLLER_COMMAND_FAILED`, `CAMERA_UNREACHABLE`, `CAMERA_LOGIN_FAILED`, `PLAYER_UNREACHABLE`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Busy:
      description: Too many requests of this kind are waiting (`CAMERA_BUSY`, `PLAYER_BUSY`); retry after `Retry-After` seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: |
        The API key's role does not allow this (`FORBIDDEN`, with `role` and `required_role`), or
        door control is switched off in Composer (`DOOR_CONTROL_DISABLED`), or a claim token was
        asked for through remote access (`CLAIM_ONLY_ON_HOME_NETWORK`), or the alarm's status or a
        backup was asked for without sealing the request (`SEALED_REQUEST_REQUIRED`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: The bridge cannot serve this right now (`UNAVAILABLE`), or cannot seal remote requests (`LOCK_UNAVAILABLE`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MusicCommand:
      description: Done; the player took it. The room as it is now (what plays may take a moment to follow).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MusicRoom"

  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: brightness must be a whole number from 0 to 100
        code:
          type: string
          description: Stable machine-readable error code.
          example: INVALID_FIELD
        attempts_remaining:
          type: integer
          description: Wrong pairing codes still allowed before pairing locks (`PAIRING_CODE_INVALID`).
        retry_after:
          type: integer
          description: Seconds to wait before trying again, as in the `Retry-After` header (`PAIRING_RATE_LIMITED`).
        store:
          type: string
          description: The store a restore could not save (`RESTORE_FAILED`).
        limit:
          type: integer
          description: The most devices a user has (`USER_DEVICE_LIMIT`, 1.9.0).
        user:
          type: object
          description: The user who has that many (`USER_DEVICE_LIMIT`; not to a caller without a key, such as a device pairing).
          properties:
            id:
              type: string
              pattern: "^[0-9a-f]{8}$"
            name:
              type: string
        devices:
          type: array
          description: |
            That user's devices, for a caller who sees the user (an admin, or the user themself), so
            that the app says "Remove a device first" with the list (`USER_DEVICE_LIMIT`).
          items:
            $ref: "#/components/schemas/LimitDevice"
        device_names:
          type: array
          description: The names of the devices in question (`OWNER_ACCOUNT_UNCLEAR`, `OWNER_ACCOUNT_SHARED`, 1.9.0).
          items:
            type: string
        errors:
          type: array
          description: Field-level details for validation errors.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    Health:
      type: object
      required: [product, status, version, api_version, detail]
      properties:
        product:
          type: string
          const: directorlink
          description: |
            Always `directorlink`: tells DirectorLink from other devices on the home network (the
            app's Find my controller asks this route at the addresses homes use most). Since 1.3.0.
        status:
          $ref: "#/components/schemas/BridgeStatus"
        version:
          type: string
          example: 0.2.0
        api_version:
          type: string
          example: "1"
        detail:
          type: [string, "null"]
          description: Why the bridge is not `ok`.

    BridgeStatus:
      type: string
      description: "`starting` while the project is being discovered, `ok` when ready, `error` when discovery failed."
      enum: [starting, ok, error]

    System:
      type: object
      required: [bridge, controller, location, inventory, lifecycle, features]
      properties:
        bridge:
          type: object
          required: [version, api_version, status, detail, started_at]
          properties:
            version:
              type: string
              example: 0.2.0
            api_version:
              type: string
              example: "1"
            status:
              $ref: "#/components/schemas/BridgeStatus"
            detail:
              type: [string, "null"]
            started_at:
              type: string
              format: date-time
        controller:
          type: object
          required: [platform, os_version, model]
          properties:
            platform:
              type: string
              const: control4
            os_version:
              type: [string, "null"]
              example: 3.4.3.727848-res
            model:
              type: [string, "null"]
              example: XDT_CORE1
        location:
          type: object
          required: [city, country_code, country, latitude, longitude, timezone]
          properties:
            city:
              type: [string, "null"]
            country_code:
              type: [string, "null"]
              example: IL
            country:
              type: [string, "null"]
            latitude:
              type: [number, "null"]
              description: For admin keys only, rounded to two decimals; null for other roles.
            longitude:
              type: [number, "null"]
              description: For admin keys only, rounded to two decimals; null for other roles.
            timezone:
              type: [string, "null"]
        temperature_scale:
          type: string
          enum: [C, F]
          description: >-
            The project's temperature scale, for what no one thermostat says (the weather, weather
            schedules' thresholds, "only if") — Composer's, as Director reports it; else the one most
            thermostats work in; else C. Since 1.10.2 (ADR-076); missing before (then °C).
            Thresholds stay °C in the API.
        inventory:
          type: object
          description: What the home has; for a member (1.8.0, ADR-054) only what they see, their rooms and the devices there that they see.
          required: [rooms, devices, supported_devices, lights, thermostats, fans, blinds, cameras, relays, doorbells, refrigerators]
          properties:
            rooms:
              type: integer
            devices:
              type: integer
            supported_devices:
              type: integer
            lights:
              type: integer
            thermostats:
              type: integer
            fans:
              type: integer
              description: Since 1.2.0.
            blinds:
              type: integer
            cameras:
              type: integer
            relays:
              type: integer
            doorbells:
              type: integer
              description: Since 1.10.0 a doorbell camera (ADR-065) counts here and in `cameras`.
            refrigerators:
              type: integer
              description: Since 1.7.0.
        lifecycle:
          type: object
          description: Driver load history, useful when testing driver updates.
          required: [reload_count, last_init_type, last_init_time, last_destroy_type, last_destroy_time]
          properties:
            reload_count:
              type: integer
            last_init_type:
              type: [string, "null"]
            last_init_time:
              type: [string, "null"]
            last_destroy_type:
              type: [string, "null"]
            last_destroy_time:
              type: [string, "null"]
        features:
          type: object
          description: |
            Optional parts of DirectorLink: `jewish_calendar`, `alarm_status` and `sonos` an
            installer switches on in Composer; `backup` is the driver's own (1.4.0). Clients show
            none of a feature that is false or missing, and none at all when `features` is missing
            (drivers before 1.2.0).
          required: [jewish_calendar, alarm_status, backup, sonos]
          properties:
            jewish_calendar:
              type: boolean
              description: "The Jewish Calendar property is On: `/v1/calendar`, `shabbat` schedule triggers and `during_shabbat`."
            alarm_status:
              type: boolean
              description: The **Alarm Status** property is On; admins and the members given it can read `GET /v1/alarm` in sealed requests.
            backup:
              type: boolean
              description: "Always true since 1.4.0: admins can make and restore backups (`GET /v1/backup`, `POST /v1/restore`, ADR-042). Missing before 1.4.0, so clients show no backup."
            sonos:
              type: boolean
              description: "The **Sonos** property is On (1.5.0, ADR-044): `/v1/music` lists the Sonos rooms. Missing before 1.5.0."
            automatic_backup:
              type: boolean
              description: "Always true since 1.6.0: admins can set automatic backups to the account (`/v1/backup/automatic`, ADR-048). Missing before 1.6.0."
            alert_choices:
              type: boolean
              description: "Always true since 1.7.0: alerts are sealed to each device's key, and every key chooses its own (`/v1/alerts/choices`, ADR-050). Missing before 1.7.0, whose alerts go to admins only."
            scene_links:
              type: boolean
              description: "Always true since 1.7.0: admins can make a link per scene for the phone's own automations (`/v1/scene-links`, ADR-051). Missing before 1.7.0."
            refrigerators:
              type: boolean
              description: "Always true since 1.7.0: `/v1/refrigerators` and the `refrigerators` scene step (ADR-049). Missing before 1.7.0."
            people_permissions:
              type: boolean
              description: "Always true since 1.8.0: admins and members set per person (`/v1/profiles/{profileId}/access`, `access` in `/v1/api-keys/current`), rooms hidden from members (ADR-054). Missing before 1.8.0, whose keys have one of four roles."
            sonos_groups:
              type: boolean
              description: "Always true since 1.8.0: `/v1/music/{musicId}/group` (join, leave, the group's volume), `groups` in `GET /v1/music`, and music scene steps that resume, set a volume or play a favorite (ADR-057). Missing before 1.8.0."
            ask_links:
              type: boolean
              description: "Always true since 1.8.0: links that ask their person to open a door or gate (`/v1/ask-links`), and a pulse that answers one (ADR-058). Missing before 1.8.0."
            camera_alerts:
              type: boolean
              description: "A camera of the project raises alerts this DirectorLink passes on: the `camera` alert choice (1.8.0, ADR-056: the DirectorLink · Hikvision Camera driver; since 1.10.0 any camera driver of DirectorLink's camera agreement, ADR-065). Missing before 1.8.0."
            users:
              type: boolean
              description: "Always true since 1.9.0: `GET /v1/users` (Settings → Users), up to five devices a user, the devices of one account brought into one user, pairing codes for a chosen user (`/v1/pairing-code`), members adding and removing their own devices (ADR-061). Missing before 1.9.0."
            climate_last_mode:
              type: boolean
              description: "Always true since 1.10.0: each thermostat's `last_mode` in `/v1/thermostats`, and the climate scene step `mode` `on` that turns each AC on as it was (ADR-070). Missing before 1.10.0, whose scenes refuse `on`."
            scene_levels_dimmers_only:
              type: boolean
              description: "Always true since ADR-077's change of 2026-10-09: a lights scene step with a level above 0 for a room or the whole home (no `device_ids`) goes to dimmers only, and on/off lights there stay as they are (skipped, `ON_OFF_ONLY`, counted in the run's `on_off_only`); one the step names still turns on. Missing before, when such a step turned them on."

    PairRequest:
      oneOf:
        - $ref: "#/components/schemas/PairWithCode"
        - $ref: "#/components/schemas/CpaceStart"
        - $ref: "#/components/schemas/CpaceFinish"

    KeyExpiresIn:
      type: integer
      minimum: 60
      maximum: 2592000
      description: The new key stops working this many seconds after it is made (ADR-040); without it, never.

    CpaceStart:
      type: object
      required: [cpace]
      additionalProperties: false
      description: "CPace, first request: no code is sent. `name` and `expires_in` are bound into the exchange (CI)."
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        expires_in:
          $ref: "#/components/schemas/KeyExpiresIn"
        cpace:
          type: object
          required: [nonce]
          additionalProperties: false
          properties:
            nonce:
              type: string
              description: 16 random bytes, base64 (the client's half of sid).

    CpaceFinish:
      type: object
      required: [cpace]
      additionalProperties: false
      description: "CPace, second request: the client's share and its tag."
      properties:
        cpace:
          type: object
          required: [session, share, confirm]
          additionalProperties: false
          properties:
            session:
              type: string
              description: From the first answer.
            share:
              type: string
              description: The client's share Yb (32 bytes, base64).
            confirm:
              type: string
              description: HMAC-SHA512(mac_key, lv_cat(Yb, "")), base64 (64 bytes).

    CpaceStarted:
      type: object
      required: [cpace]
      properties:
        cpace:
          type: object
          required: [session, nonce, share]
          properties:
            session:
              type: string
              description: Names this exchange in the second request (it works once, for 60 seconds, from this device).
            nonce:
              type: string
              description: The controller's 16 random bytes, base64 (the second half of sid).
            share:
              type: string
              description: The controller's share Ya (32 bytes, base64).

    CpacePaired:
      type: object
      required: [cpace, sealed]
      properties:
        cpace:
          type: object
          required: [confirm]
          properties:
            confirm:
              type: string
              description: HMAC-SHA512(mac_key, lv_cat(Ya, "")), base64 (64 bytes); check it before opening `sealed`.
        sealed:
          $ref: "#/components/schemas/Envelope"

    PairWithCode:
      type: object
      required: [pairing_code]
      additionalProperties: false
      properties:
        pairing_code:
          type: string
          pattern: "^[0-9]{4}[ -]?[0-9]{4}$"
          description: The 8 digits Composer shows, e.g. `1234 5678` (the space or a dash is optional).
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: A name for the new key, e.g. the browser or app using it.
        expires_in:
          $ref: "#/components/schemas/KeyExpiresIn"
        exchange:
          type: object
          required: [public_key]
          additionalProperties: false
          description: The app's half of an X25519 key exchange; the answer is then sealed.
          properties:
            public_key:
              type: string
              description: The 32-byte X25519 public key, base64.

    NewHomeSecret:
      type: object
      required: [home_id, secret_sha256]
      properties:
        home_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        secret_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 (hex) of the new secret; the secret itself never leaves the controller.

    SealedPairing:
      type: object
      required: [exchange, sealed]
      properties:
        exchange:
          type: object
          required: [public_key]
          properties:
            public_key:
              type: string
              description: The driver's X25519 public key, base64.
        sealed:
          $ref: "#/components/schemas/Envelope"

    Envelope:
      type: object
      description: "A sealed message (docs/ACCOUNTS.md): AES-256-CBC, then HMAC-SHA256 over it."
      required: [v, home, key, iv, ct, mac]
      properties:
        v:
          type: integer
          enum: [1]
        home:
          type: string
        key:
          type: string
        iv:
          type: string
        ct:
          type: string
        mac:
          type: string

    SealedInfo:
      type: object
      required: [home, time, window_seconds]
      properties:
        home:
          type: string
          enum: [lan]
          description: What envelopes on the home network name as their home (not the remote-access home id, which is not given out without a key).
        time:
          type: integer
          description: The controller's clock, seconds since 1970; a request's `ts` must be within `window_seconds` of it.
        window_seconds:
          type: integer

    SealedRequest:
      type: object
      required: [envelope]
      additionalProperties: false
      properties:
        envelope:
          $ref: "#/components/schemas/Envelope"

    SealedAnswer:
      type: object
      required: [envelope]
      properties:
        envelope:
          $ref: "#/components/schemas/Envelope"

    KeyRole:
      type: string
      enum: [viewer, member, doors, admin]
      description: |
        The role a key had in DirectorLink 1.7.0, worked out since 1.8.0 from its person (ADR-054):
        `admin` for an admin; for a member `viewer` when they have no rooms, `doors` when they open
        doors and gates, else `member`. Sent by a 1.7.0 client, it sets the person as that role
        became: `admin` an admin; `doors` a member with every room, every kind, cameras, doors and
        gates, the alarm's status and every scene; `member` the same without doors and gates (and
        without the scenes that open them); `viewer` a member with no rooms and cameras only.

    PersonRole:
      type: string
      enum: [admin, member]
      description: Admins do everything; members what an admin gave them (ADR-054).

    DeviceKinds:
      type: object
      additionalProperties: false
      description: The kinds of devices a member uses in their rooms; off hides that kind from them.
      properties:
        light:
          type: boolean
          description: Lights (heaters wired as lights too).
        climate:
          type: boolean
          description: Thermostats (AC and heating).
        fan:
          type: boolean
        blind:
          type: boolean
        music:
          type: boolean
          description: Sonos rooms.
        refrigerator:
          type: boolean

    PersonAccessUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/PersonRole"
        all_rooms:
          type: boolean
          description: Sees every room (but those hidden from members); `rooms` is kept for when it is false.
        rooms:
          type: array
          maxItems: 1000
          items:
            type: integer
          description: The rooms a member sees when `all_rooms` is false.
        kinds:
          $ref: "#/components/schemas/DeviceKinds"
        cameras:
          type: boolean
          description: Sees the cameras in their rooms, and the picture of a doorbell in their rooms.
        doors:
          type: boolean
          description: Opens the doors and gates in their rooms (with Door Control on in Composer).
        alarm:
          type: boolean
          description: Sees the alarm's status (with Alarm Status on in Composer).
        scenes:
          type: array
          maxItems: 200
          items:
            type: string
            pattern: "^[0-9a-f]{8}$"
          description: The scenes a member may run, in full; they never edit scenes.

    PersonAccess:
      type: object
      required: [role, owner, all_rooms, rooms, kinds, cameras, doors, alarm, scenes]
      description: |
        A person's role and permissions (ADR-054). For an admin, what they would have as a member;
        for the caller's own (`GET /v1/api-keys/current`, `/v1/profile`) an admin's are all true and
        `scenes` is empty (every scene is theirs), and a member's `rooms` leave out rooms hidden from
        members.
      properties:
        role:
          $ref: "#/components/schemas/PersonRole"
        owner:
          type: boolean
          description: The home's owner (the person who claimed it for an account, else the oldest admin), always an admin.
        all_rooms:
          type: boolean
        rooms:
          type: array
          items:
            type: integer
        kinds:
          $ref: "#/components/schemas/DeviceKinds"
        cameras:
          type: boolean
        doors:
          type: boolean
        alarm:
          type: boolean
        scenes:
          type: array
          items:
            type: string
            pattern: "^[0-9a-f]{8}$"

    ApiKeyUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        role:
          $ref: "#/components/schemas/KeyRole"
        profile_id:
          type: string
          pattern: "^[0-9a-f]{8}$"
          description: Moves the key to another person's profile; an empty profile left behind goes.

    ApiKeyCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/KeyRole"
          description: Default `member`. With `access`, `admin` or `member`.
        access:
          $ref: "#/components/schemas/PersonAccessUpdate"
          description: A new member's permissions (since 1.8.0); not with `profile_id`.
        name:
          type: string
          minLength: 1
          maxLength: 64
        profile_id:
          type: string
          pattern: "^[0-9a-f]{8}$"
          description: Another device of an existing person joins their profile; without it the key gets a new profile.

    ApiKey:
      type: object
      required: [id, name, role, created_at, last_used_at, current, expires_at]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{8}$"
        name:
          type: string
        role:
          $ref: "#/components/schemas/KeyRole"
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: Last use; since 1.9.0 kept across restarts, to the hour (ADR-061).
        current:
          type: boolean
          description: True for the key that made this request.
        profile_id:
          type: [string, "null"]
          pattern: "^[0-9a-f]{8}$"
          description: The profile (person) the key belongs to.
        expires_at:
          type: [string, "null"]
          format: date-time
          description: When the key stops working (paired with `expires_in`, such as the API console's own key); null for never. Then it is refused with `KEY_EXPIRED` and removed.
        access:
          $ref: "#/components/schemas/PersonAccess"
          description: "`GET /v1/api-keys/current` only (since 1.8.0): what the caller's person may do."

    NewApiKey:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: The secret. It is shown only once — store it now.

    ApiKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"

    RoomNames:
      type: object
      description: The room's name per language (BCP 47 tag such as `en`, `he`, `pt-BR`), set with `PATCH /v1/rooms/{roomId}`. Empty when none were set; show `name` then.
      additionalProperties:
        type: string
      example:
        en: Living room

    RoomRef:
      type: object
      required: [id, name, names]
      properties:
        id:
          type: integer
        name:
          type: string
          description: The name in the Control4 project.
        names:
          $ref: "#/components/schemas/RoomNames"

    Room:
      type: object
      required: [id, name, names, floor, device_count]
      properties:
        id:
          type: integer
        name:
          type: string
          description: The name in the Control4 project.
        names:
          $ref: "#/components/schemas/RoomNames"
        floor:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id:
                  type: integer
                name:
                  type: string
            - type: "null"
        device_count:
          type: integer
          description: The devices in the room that the caller sees.
        hidden_from_members:
          type: boolean
          description: Since 1.8.0 (ADR-054). Hidden from every member; only admins see such a room.

    RoomUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        hidden_from_members:
          type: boolean
          description: Hides the room, and its devices, from every member (admins only see it).
        names:
          type: object
          description: Language → name (1–64 characters); an empty string removes that language.
          additionalProperties:
            type: string
            maxLength: 64

    RoomList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Room"

    SceneStep:
      type: object
      required: [type, set]
      additionalProperties: false
      description: |
        One step: devices of one type, and what to set. `device_ids` names the devices (with
        `room_id` as the room they were picked in); without it, every device of the type in
        `room_id`, or in the whole home when `room_id` is null. A `music` step (1.5.0) names no
        devices: it pauses or stops the Sonos groups with a room in `room_id`, or every group;
        since 1.8.0 (ADR-057) it also resumes them, sets the volume of each Sonos room there, or
        plays a Sonos favorite in the Sonos rooms of `room_id` (required then), with those of
        `with_room_ids` grouped with them.
        A `refrigerators` step (1.7.0) switches features of Samsung refrigerators.
        A member (1.8.0, ADR-054) gets only the rooms and devices they see: a room they do not see
        is null, `device_ids` and `with_room_ids` leave out the ones they do not see (`device_ids`
        is null when none is left), `elsewhere` says the step does more than that, and a favorite
        comes without its `uri` and `meta`.
      properties:
        type:
          type: string
          enum: [lights, climate, fans, blinds, relays, music, refrigerators]
        elsewhere:
          type: boolean
          readOnly: true
          description: In a member's scenes only (1.8.0); true when the step also works on rooms or devices left out for them.
        room_id:
          type: [integer, "null"]
          minimum: 1
        device_ids:
          type: [array, "null"]
          minItems: 1
          maxItems: 100
          items:
            type: integer
            minimum: 1
        set:
          description: |
            lights `{"on": true|false}` or `{"brightness": 0-100}` (on/off lights the step names
            by `device_ids` turn on; a level above 0 for a room or the whole home goes to dimmers
            only, and on/off lights there are skipped with `ON_OFF_ONLY` since ADR-077's change of
            2026-10-09, `features.scene_levels_dimmers_only`; off and a level of 0 turn every light
            off);
            climate any of `mode` (off, heat, cool, auto), `target_temperature` (kept within
            each thermostat's range) and `fan_speed` (low, medium, high, auto, on, circulate; left
            out where a unit does not have it), and with `mode: off` nothing else; what is left out
            stays as it is (a step with a mode alone keeps the temperature and fan); since 1.10.0
            (ADR-070) `mode: on`, alone: each thermostat that is off goes back to its last mode that
            was not off (`last_mode` in `GET /v1/thermostats`), with nothing else sent, so its
            temperature and fan stay as they were; one that is on is left as it is (it counts as
            ran); one whose last mode is not known yet is skipped with `NO_LAST_MODE`, and one whose
            last mode DirectorLink cannot set with `MODE_NOT_SUPPORTED` (never a guessed mode);
            fans (1.2.0)
            `{"on": true|false}` or `{"speed": 1-4}` (1 low to 4 high); blinds
            `{"position": 0-100}`; relays `{"action": "pulse"}`, what their Open button does (a
            door or gate relay is never held closed by a scene); music `{"action": "pause"}` or
            `{"action": "stop"}` (a radio station, which cannot pause, stops; a group pauses as
            one), and since 1.8.0 `{"action": "resume"}` (a group paused or stopped plays again),
            `{"action": "volume", "volume": 0-100}` (each Sonos room's own) or
            `{"action": "play_favorite", "favorite": {"id": "10"}, "volume": 0-100,
            "with_room_ids": [11]}` (volume and with_room_ids optional; the favorite is kept as the
            favorites list has it: its `title`, and the `uri` and `meta` that start it; at run time
            it is started as the list has it then, and a favorite no longer there is skipped with
            `FAVORITE_GONE`); refrigerators (1.7.0) any of `power_cool`, `power_freeze`, `sabbath_mode` and
            `ice_maker`, true (on) or false (off), at least one (a feature a refrigerator does not
            have is left out on it, `partial`, or skipped with `NOT_SUPPORTED` when none is left).
            climate may carry `heat_setpoint` and/or `cool_setpoint` instead of
            `target_temperature` (cool above heat): dual-setpoint thermostats take them as their
            setpoints (left out where they come closer than the thermostat's deadband);
            single-setpoint thermostats take `heat_setpoint` in heat and `cool_setpoint` in cool.
            On dual-setpoint thermostats `target_temperature` sets the setpoint of the step's mode
            (or of the current mode), and is left out in auto and off. Temperatures are °C; a
            thermostat in °F gets the whole °F nearest, so a client in °F sends its whole °F as °C to
            0.1 (69 °F as 20.6) and the thermostat gets exactly that °F (1.10.2). A temperature
            sensor (`sensor: true`) is skipped (`NOT_SUPPORTED`), and a step for a room's climate
            leaves it out.
          type: object
          additionalProperties: false
          properties:
            "on":
              type: boolean
            brightness:
              type: integer
              minimum: 0
              maximum: 100
            speed:
              type: integer
              minimum: 1
              maximum: 4
            mode:
              type: string
              enum: ["off", "on", heat, cool, auto]
              description: '`on` (1.10.0): each AC on as it was, in its last mode; drivers before 1.10.0 refuse it.'
            target_temperature:
              type: number
              minimum: 5
              maximum: 40
            heat_setpoint:
              type: number
              minimum: 5
              maximum: 40
            cool_setpoint:
              type: number
              minimum: 5
              maximum: 40
            fan_speed:
              type: string
              enum: [low, medium, high, auto, "on", circulate]
            position:
              type: integer
              minimum: 0
              maximum: 100
            action:
              type: string
              enum: [pulse, pause, stop, resume, volume, play_favorite]
            volume:
              type: integer
              minimum: 0
              maximum: 100
              description: A music step's volume (1.8.0), each Sonos room's own.
            favorite:
              type: object
              description: |
                The Sonos favorite a `play_favorite` step plays (1.8.0): its `id` as
                `GET /v1/music/{musicId}/favorites` lists it. DirectorLink keeps it as the favorites
                list has it when the step is saved (its name, and the address and description that
                start it); sent back unchanged, it is kept.
              required: [id]
              additionalProperties: false
              properties:
                id:
                  type: string
                  pattern: "^[0-9]{1,9}$"
                title:
                  type: string
                  maxLength: 1024
                uri:
                  type: string
                  maxLength: 2048
                meta:
                  type: string
                  maxLength: 8192
            with_room_ids:
              type: array
              maxItems: 32
              description: The rooms whose Sonos rooms play the favorite too, grouped with the step's room's (1.8.0). Rooms not in the project are left out.
              items:
                type: integer
                minimum: 1
            power_cool:
              type: boolean
            power_freeze:
              type: boolean
            sabbath_mode:
              type: boolean
            ice_maker:
              type: boolean

    SceneIcon:
      type: string
      enum: [moon, sun, leave, movie, bulb, climate, blinds, home]

    Scene:
      type: object
      required: [id, name, icon, show_on_home, steps, created_at, updated_at, version]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{8}$"
        name:
          type: string
        icon:
          $ref: "#/components/schemas/SceneIcon"
        show_on_home:
          type: boolean
          description: Shown with a Run button at the top of Home.
        steps:
          type: array
          items:
            $ref: "#/components/schemas/SceneStep"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1

    SceneList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Scene"

    SceneCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        icon:
          $ref: "#/components/schemas/SceneIcon"
        show_on_home:
          type: boolean
        steps:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/SceneStep"

    SceneUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        icon:
          $ref: "#/components/schemas/SceneIcon"
        show_on_home:
          type: boolean
        steps:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/SceneStep"
        version:
          type: integer
          minimum: 1

    SceneTry:
      type: object
      required: [steps]
      additionalProperties: false
      properties:
        steps:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/SceneStep"

    TurnOff:
      type: object
      required: [type, device_ids]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [lights, climate, blinds]
          description: lights are turned off, thermostats set to `off`, blinds closed.
        device_ids:
          type: array
          minItems: 1
          maxItems: 500
          description: Lights, thermostats or blinds, as `type` says; a repeated id counts once.
          items:
            type: integer
            minimum: 1

    SceneLink:
      type: object
      description: A scene's link for the phone's own automations (1.7.0, ADR-051), without its secret.
      required: [scene_id, scene_name, link_id, label, made_by, created_at, last_used_at]
      properties:
        scene_id:
          type: string
          pattern: "^[0-9a-f]{8}$"
        scene_name:
          type: [string, "null"]
        link_id:
          type: string
          pattern: "^[0-9a-f]{8}$"
          description: Not secret; the link's address names it.
        label:
          type: [string, "null"]
          description: What an admin called it ("Arriving home", "NFC by the door"); shown in the history with each run.
        made_by:
          type: [string, "null"]
          pattern: "^[0-9a-f]{8}$"
          description: The id of the API key that made it. Revoking that key, or its expiry, removes the link, and so does its person being made a member (1.8.0, ADR-054); Revoke All API Keys removes every link. Null for a link made before this was kept (a test build of 1.7.0), which only Revoke All API Keys ends.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time

    SceneLinkList:
      type: object
      required: [items, remote_access, home_linked]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SceneLink"
        remote_access:
          type: boolean
          description: The Remote Access property is On; links work only then.
        home_linked:
          type: boolean
          description: The account service has accepted this home's identity; links work only then, and only while an account has the home.

    SceneLinkCreate:
      type: object
      additionalProperties: false
      properties:
        label:
          type: [string, "null"]
          maxLength: 64
          description: Optional; blank for none.

    SceneLinkCreated:
      allOf:
        - $ref: "#/components/schemas/SceneLink"
        - type: object
          required: [home_id, secret, url, replaced]
          properties:
            home_id:
              type: string
              pattern: "^[0-9a-f]{32}$"
            secret:
              type: string
              pattern: "^[0-9a-f]{40}$"
              description: 160 random bits, shown only in this answer. Whoever has it can run this scene.
            url:
              type: string
              description: |
                `https://api.directorlink.io/run/<home_id>.<link_id>#<secret>`. Opened in a browser (an
                NFC tag), it shows a Run button; the browser never sends what follows `#`, and the page
                posts it. An automation posts to the address before `#` with the secret in the body.
            replaced:
              type: boolean
              description: The scene had a link, which stopped working.

    AskLink:
      type: object
      description: A link that asks its person to open a door or gate (1.8.0, ADR-058), without its secret.
      required: [link_id, relay_id, relay_name, room_id, label, made_by, device, person, this_device, this_user, created_at, last_used_at]
      properties:
        link_id:
          type: string
          pattern: "^[0-9a-f]{8}$"
          description: Not secret; the link's address names it.
        relay_id:
          type: integer
          minimum: 1
        relay_name:
          type: [string, "null"]
          description: The door or gate; null while it is not in the project.
        room_id:
          type: [integer, "null"]
        label:
          type: [string, "null"]
          description: What its person called it ("Arriving home"); in the question and in the history.
        made_by:
          type: string
          pattern: "^[0-9a-f]{8}$"
          description: The API key that made it. Revoking that key, or its expiry, removes the link.
        device:
          type: [string, "null"]
          description: Since 1.9.0 (ADR-062). The device it was made on (the name of the key that made it); null when that key is gone.
        person:
          type: [string, "null"]
          description: The person it asks (the key's profile), by name.
        this_device:
          type: boolean
          description: Made with the key that asks.
        this_user:
          type: boolean
          description: Since 1.9.0 (ADR-062). Made on a device of the asking key's user (this device's own link included), which the app shows on the door's screen with Remove; for a member every link listed is.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time

    AskLinkList:
      type: object
      required: [items, remote_access, home_linked, door_control]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AskLink"
        remote_access:
          type: boolean
          description: The Remote Access property is On; links work only then.
        home_linked:
          type: boolean
          description: The account service has accepted this home's identity.
        door_control:
          type: boolean
          description: The Door Control property is Enabled; a run asks nobody while it is not.

    AskLinkCreate:
      type: object
      additionalProperties: false
      required: [relay_id]
      properties:
        relay_id:
          type: integer
          minimum: 1
          description: The door or gate (a relay) it asks about.
        label:
          type: [string, "null"]
          maxLength: 64
          description: Optional; blank for none.

    AskLinkCreated:
      allOf:
        - $ref: "#/components/schemas/AskLink"
        - type: object
          required: [home_id, secret, url, replaced]
          properties:
            home_id:
              type: string
              pattern: "^[0-9a-f]{32}$"
            secret:
              type: string
              pattern: "^[0-9a-f]{40}$"
              description: 160 random bits, shown only in this answer. Whoever has it can make its person's phone ask, nothing more.
            url:
              type: string
              description: "`https://api.directorlink.io/run/<home_id>.<link_id>#<secret>`, as a scene link's."
            replaced:
              type: boolean
              description: This key had a link for this door, which stopped working.

    RelayPulse:
      type: object
      properties:
        request:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: An open request's id, from the sealed alert an ask-to-open link made (1.8.0, ADR-058).

    SceneRun:
      type: object
      required: [ran, skipped, failed, problems]
      properties:
        scene_id:
          type: string
          pattern: "^[0-9a-f]{8}$"
        ran:
          type: integer
          description: Devices whose commands were handed to the controller (and Sonos groups told to pause or stop).
        skipped:
          type: integer
          description: Devices left alone (not allowed for this key, not possible for the device, or gone from the project; since 1.10.0 an AC a step turns on as it was whose last mode is not known yet, `NO_LAST_MODE`; since ADR-077's change of 2026-10-09 the on/off lights a level for a room or the whole home leaves as they are, `ON_OFF_ONLY`, also counted in `on_off_only`).
        on_off_only:
          type: integer
          minimum: 1
          description: Of the skipped, the on/off lights (`dimmable` false) a level for a room or the whole home left as they are, as meant (`ON_OFF_ONLY`); every one, while `problems` lists at most 50, these after the others. Only when there are some. Since ADR-077's change of 2026-10-09.
        failed:
          type: integer
          description: Devices whose commands the controller refused.
        problems:
          type: array
          maxItems: 50
          description: What was skipped or failed, and devices that ran with a setting left out (`partial`, counted in `ran`), at most 50; on/off lights left as they are (`ON_OFF_ONLY`) come after the others.
          items:
            type: object
            required: [step, device_id, outcome, code, detail]
            properties:
              step:
                type: integer
                minimum: 1
                description: The step, counted from 1.
              device_id:
                type: integer
                description: The device; 0 for a music step (`SONOS_OFF`, `NO_PLAYERS`, `NO_SONOS_ROOM`, and since 1.8.0 `FORBIDDEN` for Sonos rooms this key may not control, `FAVORITE_GONE`, `FAVORITE_NOT_PLAYABLE`), and for a member's run a device they do not see (1.8.0, ADR-054).
              outcome:
                type: string
                enum: [skipped, failed, partial]
              code:
                type: string
              detail:
                type: string

    ScheduleTrigger:
      description: |
        `time`: `at` ("HH:MM"). `sun`: `event` (sunrise, sunset) and `offset` in minutes (-180 to
        180; negative is before). `weather`: `kind` heat (`above` °C or hotter, 15 to 45), wind
        (`above` km/h or more, 10 to 150) or rain (starts raining), optional hours `from`–`to`
        ("HH:MM", may cross midnight), and `once_a_day` (default true). A weather schedule runs
        again only after it has cooled to 2° below the threshold or less, the wind has dropped to
        10 km/h below it or less, or an hour without rain. The threshold itself counts (for running
        again and in `only_if` since 1.10.1). `shabbat` (needs the Jewish
        calendar, `/v1/calendar`): `event` candle_lighting (when Shabbat or a holiday begins) or
        havdalah (when it ends), and `offset` in minutes (-360 to 360; negative is before). Shabbat
        and holidays that follow each other are one period, so it runs once when the period
        begins, or once when it ends.
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [time, sun, weather, shabbat]
        at:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        event:
          type: string
          enum: [sunrise, sunset, candle_lighting, havdalah]
          description: sunrise and sunset for `sun`, candle_lighting and havdalah for `shabbat`.
        offset:
          type: integer
          minimum: -360
          maximum: 360
          description: Minutes (default 0); -180 to 180 for `sun`.
        kind:
          type: string
          enum: [heat, wind, rain]
        above:
          type: number
          description: The threshold, which itself counts — heat `above` °C or hotter, wind `above` km/h or more. A client in °F (`temperature_scale`, 1.10.2) that shows the weather in whole °F keeps a whole °F as the °C of the half degree below, rounded up to 0.1 (81 °F as 27.0, which is 80.6 °F), as the weather is °C to 0.1; it then counts from the moment that client shows that °F.
        from:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        to:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        once_a_day:
          type: boolean

    ScheduleConditions:
      description: |
        For time, sun and Shabbat schedules: run only if it is not raining, `hotter_than` a
        temperature or warmer, the wind `wind_below` a speed or less, or rain is forecast for today
        (a 50% chance or more). The threshold itself counts, as for weather triggers (since 1.10.1:
        up to 1.10.0 `hotter_than` needed more than it and `wind_below` less than it). Checked when
        the schedule runs, with the latest weather.
      type: object
      additionalProperties: false
      properties:
        not_raining:
          type: boolean
        hotter_than:
          type: number
          minimum: 15
          maximum: 45
          description: °C; runs at this temperature or warmer. In °F, as `above`.
        wind_below:
          type: number
          minimum: 10
          maximum: 150
          description: km/h; runs at this wind speed or less.
        rain_expected:
          type: boolean

    ScheduleDays:
      type: array
      minItems: 1
      maxItems: 7
      description: Weekdays, 0 (Sunday) to 6 (Saturday).
      items:
        type: integer
        minimum: 0
        maximum: 6

    DuringShabbat:
      type: string
      enum: [run, skip, only]
      description: |
        For time, sun and weather schedules, what to do on Shabbat and holidays (from candle
        lighting to havdalah): `run` as usual (the default), `skip`, or run `only` then. Always
        `run` for a `shabbat` trigger. While the Jewish calendar is off, or has no location, no
        moment counts as holy: `only` schedules do not run and `skip` schedules run as usual.

    Schedule:
      type: object
      required: [id, enabled, scene_id, trigger, days, only_if, if_no_weather, during_shabbat, calendar_status, next_run, last_run, version, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{8}$"
        enabled:
          type: boolean
        scene_id:
          type: string
          pattern: "^[0-9a-f]{8}$"
        trigger:
          $ref: "#/components/schemas/ScheduleTrigger"
        days:
          $ref: "#/components/schemas/ScheduleDays"
        only_if:
          $ref: "#/components/schemas/ScheduleConditions"
        if_no_weather:
          type: string
          enum: [run, skip]
          description: When `only_if` needs the weather and there is none.
        during_shabbat:
          $ref: "#/components/schemas/DuringShabbat"
        calendar_status:
          type: [string, "null"]
          enum: [ok, "off", no_location, null]
          description: |
            For a schedule that uses the Jewish calendar (a `shabbat` trigger, or `during_shabbat`
            other than `run`), the calendar's `status` as in `/v1/calendar`: with `off` or
            `no_location` its Shabbat trigger or `only` does not run. Null for other schedules.
        next_run:
          type: [string, "null"]
          format: date-time
          description: For time, sun and Shabbat schedules that are on.
        last_run:
          type: [object, "null"]
          properties:
            at:
              type: string
              format: date-time
            ran:
              type: [integer, "null"]
            skipped:
              type: [integer, "null"]
            failed:
              type: [integer, "null"]
            note:
              type: [string, "null"]
              description: "`no_weather`: ran without weather data; `late`: ran late, after a restart (Shabbat automation, up to 6 hours); for weather schedules, the kind that made it run."
            skipped_by:
              type: [string, "null"]
              enum: [only_if, no_weather, shabbat, null]
              description: "It was due but did not run (`shabbat`: on Shabbat or a holiday, with `during_shabbat: skip`)."
            error:
              type: [string, "null"]
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ScheduleList:
      type: object
      required: [items, paused]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"
        paused:
          type: boolean
          description: The installer paused all schedules in Composer (DirectorLink's Schedules property); none runs until it is set back to On.

    ScheduleCreate:
      type: object
      required: [scene_id, trigger, days]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        scene_id:
          type: string
          pattern: "^[0-9a-f]{8}$"
        trigger:
          $ref: "#/components/schemas/ScheduleTrigger"
        days:
          $ref: "#/components/schemas/ScheduleDays"
        only_if:
          $ref: "#/components/schemas/ScheduleConditions"
        if_no_weather:
          type: string
          enum: [run, skip]
        during_shabbat:
          $ref: "#/components/schemas/DuringShabbat"

    ScheduleUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        scene_id:
          type: string
          pattern: "^[0-9a-f]{8}$"
        trigger:
          $ref: "#/components/schemas/ScheduleTrigger"
        days:
          $ref: "#/components/schemas/ScheduleDays"
        only_if:
          $ref: "#/components/schemas/ScheduleConditions"
        if_no_weather:
          type: string
          enum: [run, skip]
        during_shabbat:
          $ref: "#/components/schemas/DuringShabbat"
        version:
          type: integer
          minimum: 1

    Weather:
      type: object
      required: [status, location, fetched_at, source, forecast_for, forecast_until, current, today, attribution]
      properties:
        status:
          type: string
          enum: [ok, waiting, unreachable, no_location]
          description: "`no_location`: set the latitude and longitude in Composer's project properties. `unreachable`: Open-Meteo could not be reached and no saved forecast holds now (none was read, or it ran out 5 days after it was read)."
        detail:
          type: [string, "null"]
          description: Why the last read of the forecast failed, also while the saved forecast is used (`ok`).
        location:
          type: [object, "null"]
          description: For admin keys only (rounded); null for other roles.
          properties:
            latitude:
              type: number
            longitude:
              type: number
        fetched_at:
          type: [string, "null"]
          format: date-time
          description: When the controller read the forecast in use from Open-Meteo (1.10.0); up to 1.9.0, the current conditions.
        source:
          type: [string, "null"]
          enum: [forecast, null]
          description: "1.10.0 (ADR-071): `forecast`, the saved forecast's hour for now, always when there is weather; null without. A 1.9.0 driver gives no `source`: its weather was measured."
        forecast_for:
          type: [string, "null"]
          format: date-time
          description: The moment `current` is for (1.10.0); null without weather.
        forecast_until:
          type: [string, "null"]
          format: date-time
          description: When the saved forecast runs out, 5 days after it was read (1.10.0); then the weather is unknown until a new one is read.
        current:
          type: [object, "null"]
          description: "The weather now. From the forecast (1.10.0): the temperature and the wind between the two hours around now, the precipitation of the hour now, `raining` when it is more than 0, and no gusts."
          properties:
            temperature:
              type: number
              description: °C
            wind_speed:
              type: [number, "null"]
              description: km/h
            wind_gusts:
              type: [number, "null"]
              description: Null since 1.10.0.
            precipitation:
              type: number
              description: mm (in the hour now, from the forecast)
            raining:
              type: boolean
            weather_code:
              type: [integer, "null"]
              description: WMO weather code.
        today:
          type: object
          properties:
            max_temperature:
              type: [number, "null"]
            min_temperature:
              type: [number, "null"]
            rain_chance:
              type: [number, "null"]
              description: Percent.
            sunrise:
              type: [string, "null"]
              description: Local time, "HH:MM".
            sunset:
              type: [string, "null"]
        attribution:
          type: string

    Calendar:
      type: object
      description: |
        With the Jewish Calendar property Off: `enabled` false, `status` off and every other field
        null. Without a location (`no_location`): `settings`, `today` (by the civil date) and
        `week`, but `current` and `next` are null.
      required: [enabled, status, settings, today, week, current, next]
      properties:
        enabled:
          type: boolean
          description: DirectorLink's Jewish Calendar property is On in Composer.
        status:
          type: string
          enum: [ok, "off", no_location]
          description: "`off`: the Jewish Calendar property is Off. `no_location`: set the latitude and longitude in Composer's project properties for Shabbat and holiday times."
        settings:
          oneOf:
            - $ref: "#/components/schemas/CalendarSettings"
            - type: "null"
        today:
          oneOf:
            - $ref: "#/components/schemas/CalendarToday"
            - type: "null"
        week:
          oneOf:
            - $ref: "#/components/schemas/CalendarWeek"
            - type: "null"
        current:
          description: The holy period now (from its candle lighting until its havdalah), or null.
          oneOf:
            - $ref: "#/components/schemas/HolyPeriod"
            - type: "null"
        next:
          description: The next holy period that has not begun (the one after `current` during a period), or null.
          oneOf:
            - $ref: "#/components/schemas/HolyPeriod"
            - type: "null"

    CalendarSettings:
      type: object
      description: How the times are worked out. Kept on the controller; admins change them with `PATCH /v1/calendar/settings`.
      required: [holidays, israel, candle_lighting_minutes, havdalah_minutes, version]
      properties:
        holidays:
          type: string
          enum: [auto, israel, abroad]
          description: |
            `israel`: one day of Yom Tov, and Israel's weekly readings. `abroad`: two days of Yom
            Tov, and the readings abroad. `auto` (the default): Israel's when the home is in
            Israel (by the project's location, or else its country or time zone), otherwise abroad.
        israel:
          type: boolean
          description: Israel's holidays and readings are in use (worked out when `holidays` is `auto`).
        candle_lighting_minutes:
          type: integer
          minimum: 0
          maximum: 90
          description: Candle lighting is this many minutes before sunset (default 20).
        havdalah_minutes:
          type: integer
          minimum: 20
          maximum: 90
          description: Havdalah is this many minutes after sunset (default 42).
        version:
          type: integer
          minimum: 1
          description: 1 until the settings are first changed, then one more with every change. Send it back to detect changes made meanwhile.

    CalendarSettingsUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        holidays:
          type: string
          enum: [auto, israel, abroad]
        candle_lighting_minutes:
          type: integer
          minimum: 0
          maximum: 90
        havdalah_minutes:
          type: integer
          minimum: 20
          maximum: 90
        version:
          type: integer
          minimum: 1

    CalendarToday:
      type: object
      required: [date, hebrew, after_sunset, holidays, changes_at]
      properties:
        date:
          type: string
          format: date
          description: The civil date (local) whose daytime is this Hebrew day, "YYYY-MM-DD"; after sunset, tomorrow's.
        hebrew:
          $ref: "#/components/schemas/HebrewDate"
        after_sunset:
          type: boolean
          description: Today's sunset has passed, so the Hebrew date is already tomorrow's (it starts at sunset). Always false without a location.
        changes_at:
          type: string
          format: date-time
          description: |
            When this Hebrew day ends and the next begins, to the second (UTC): the controller's sunset,
            or local midnight without a location or where the sun does not set that day. Read the
            calendar again then (1.2.0).
          example: "2026-09-29T15:28:37Z"
        holidays:
          type: array
          description: This Hebrew day's holidays, holy or not (fasts, Chanukah, Rosh Chodesh and the national days too).
          items:
            $ref: "#/components/schemas/Holiday"

    CalendarWeek:
      type: object
      required: [date, parasha, holidays]
      properties:
        date:
          type: string
          format: date
          description: This week's Shabbat, the first Saturday on or after today's Hebrew day.
        parasha:
          description: The weekly reading that Shabbat, Israel's or abroad's (`settings.israel`); null when a holiday reading replaces it.
          oneOf:
            - $ref: "#/components/schemas/Parasha"
            - type: "null"
        holidays:
          type: array
          description: That Saturday's holidays.
          items:
            $ref: "#/components/schemas/Holiday"

    HebrewDate:
      type: object
      required: [year, month, day, leap_year]
      properties:
        year:
          type: integer
          example: 5787
        month:
          $ref: "#/components/schemas/HebrewMonth"
        day:
          type: integer
          minimum: 1
          maximum: 30
        leap_year:
          type: boolean
          description: The year has 13 months (Adar I and Adar II).

    HebrewMonth:
      type: string
      description: A Hebrew month by key; `adar` in a common year, `adar_1` and `adar_2` in a leap year. Apps show their own names.
      enum: [tishrei, cheshvan, kislev, tevet, shvat, adar, adar_1, adar_2, nisan, iyar, sivan, tamuz, av, elul]

    Holiday:
      type: object
      required: [key, day, month, yom_tov, name]
      properties:
        key:
          $ref: "#/components/schemas/HolidayKey"
        day:
          type: [integer, "null"]
          minimum: 1
          maximum: 8
          description: Which day, for a holiday kept on several (such as Rosh Hashana 1–2 or Chanukah 1–8); null for the others.
        month:
          description: For `rosh_chodesh`, the month that begins; null for the others.
          oneOf:
            - $ref: "#/components/schemas/HebrewMonth"
            - type: "null"
        yom_tov:
          type: boolean
          description: A holy day, kept like Shabbat (it is part of a holy period); the other days are only shown.
        name:
          type: string
          description: English name, for scripts and logs. Apps show their own names by `key`, `day` and `month`.
          example: Shmini Atzeret

    HolidayKey:
      type: string
      description: The holidays and other special days of the Hebrew calendar, by stable key.
      enum: [rosh_hashana, tzom_gedaliah, yom_kippur, sukkot, chol_hamoed_sukkot, hoshana_rabba, shmini_atzeret, simchat_torah, chanukah, asara_btevet, tu_bishvat, taanit_esther, purim, shushan_purim, pesach, chol_hamoed_pesach, pesach_7, pesach_8, yom_hashoah, yom_haatzmaut, yom_hazikaron, lag_baomer, yom_yerushalayim, shavuot, shiva_asar_btamuz, tisha_bav, rosh_chodesh]

    Parasha:
      type: object
      required: [ids, name]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 2
          description: The reading by number, 1 (Bereshit) to 54 (Vezot Haberakhah); two for a combined reading, such as 22 and 23 (Vayakhel-Pekudei).
          items:
            type: integer
            minimum: 1
            maximum: 54
        name:
          type: string
          description: English name (Hebcal's spelling), two joined with "-". Apps show their own names by `ids`.
          example: Vayakhel-Pekudei

    HolyPeriod:
      type: object
      description: Shabbat and holidays that follow each other, from the candle lighting before the first day to the havdalah after the last.
      required: [starts_at, ends_at, approximate, days]
      properties:
        starts_at:
          type: [string, "null"]
          format: date-time
          description: Candle lighting before the first day; null when the sun does not set that day (`approximate`).
        ends_at:
          type: [string, "null"]
          format: date-time
          description: Havdalah after the last day; null when the sun does not set that day (`approximate`).
        approximate:
          type: boolean
          description: A sunset it needs does not happen at this latitude (polar day or night). Those times are null, and schedules count its civil days as holy, from 00:00 on the first to 24:00 on the last.
        days:
          type: array
          minItems: 1
          items:
            type: object
            required: [date, shabbat, candle_lighting, holidays]
            properties:
              date:
                type: string
                format: date
                description: A holy day (the local civil date).
              shabbat:
                type: boolean
                description: It is a Saturday.
              candle_lighting:
                type: [string, "null"]
                format: date-time
                description: |
                  When candles are lit for this day, on the evening before it: `starts_at` for the
                  first day. For a later day that is a Saturday, before the previous day's sunset
                  (as on any Friday); for another later day, after nightfall, at the previous
                  day's havdalah time. Null when the sun does not set.
              holidays:
                type: array
                items:
                  $ref: "#/components/schemas/Holiday"

    RoomOrder:
      type: object
      required: [room_ids]
      additionalProperties: false
      properties:
        room_ids:
          type: array
          maxItems: 1000
          uniqueItems: true
          items:
            type: integer

    ProfilePrefs:
      type: object
      required: [language, theme, palette, favorites, hidden_rooms]
      properties:
        language:
          type: [string, "null"]
          description: '"auto" or a language tag such as "en" or "he".'
        theme:
          type: [string, "null"]
          enum: [auto, light, dark, null]
        palette:
          type: [string, "null"]
          maxLength: 20
        favorites:
          type: array
          maxItems: 200
          items:
            type: string
            pattern: "^[a-z]+:[0-9]+$"
          description: Devices shown first on Home, in order, as "kind:id" (e.g. "light:21").
        hidden_rooms:
          type: array
          maxItems: 1000
          items:
            type: integer
          description: Rooms this person hides from their lists (only for them).

    Profile:
      type: object
      required: [id, name, created_at, version, prefs]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{8}$"
        name:
          type: string
        created_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 0
          description: Goes up with every change; send it back to detect changes made meanwhile.
        prefs:
          $ref: "#/components/schemas/ProfilePrefs"
        access:
          $ref: "#/components/schemas/PersonAccess"
          description: Since 1.8.0 (ADR-054). In `/v1/profile` what the caller may do; in `/v1/profiles` each person's role and permissions.
        gone_favorites:
          type: array
          description: |
            Since 1.8.0, in the caller's own profile only (GET and PATCH /v1/profile): the favorites
            of devices the project no longer has (removed in Composer), as the last project read
            that worked found them. The controller drops them from every profile once they have
            been gone 7 days (docs/PREFERENCES.md); meanwhile the app shows them as removed.
          items:
            type: object
            required: [entry, since]
            properties:
              entry:
                type: string
                pattern: "^[a-z]+:[0-9]+$"
                description: The favorite, as in `prefs.favorites`.
              since:
                type: string
                format: date-time
                description: When a project read first found the device gone.
              name:
                type: string
                description: The name the device had, when the controller still knew it then.

    ProfileWithKeys:
      allOf:
        - $ref: "#/components/schemas/Profile"
        - type: object
          required: [key_ids]
          properties:
            key_ids:
              type: array
              items:
                type: string
                pattern: "^[0-9a-f]{8}$"

    ProfileList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProfileWithKeys"

    ProfileUpdate:
      type: object
      required: [prefs]
      additionalProperties: false
      properties:
        prefs:
          type: object
          additionalProperties: false
          properties:
            language:
              type: [string, "null"]
            theme:
              type: [string, "null"]
              enum: [auto, light, dark, null]
            palette:
              type: [string, "null"]
              maxLength: 20
            favorites:
              type: array
              maxItems: 200
              items:
                type: string
                pattern: "^[a-z]+:[0-9]+$"
            hidden_rooms:
              type: array
              maxItems: 1000
              items:
                type: integer
        version:
          type: integer
          minimum: 0

    ProfileRename:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64

    DeviceType:
      type: string
      enum: [light, thermostat, fan, blind, camera, relay, doorbell, refrigerator, other]

    Device:
      type: object
      required: [id, name, type, room, supported, href, part_of, part_of_music]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          $ref: "#/components/schemas/DeviceType"
        room:
          oneOf:
            - $ref: "#/components/schemas/RoomRef"
            - type: "null"
        supported:
          type: boolean
          description: True when this API can control the device.
        href:
          type: [string, "null"]
          description: Path of the typed resource for supported devices, e.g. `/v1/lights/259`.
        part_of:
          type: [integer, "null"]
          description: |
            Since 1.10.1: for a device this API does not control (`supported` false), the id of the
            supported device it is part of, which apps show instead: a Relay Door, Gate or Garage
            Door Controller's button shown as the KNX Contact/Relay it drives, a KNX relay on such a
            controller's Close or Stop connection (both: that door, ADR-069), a DoorBird's button,
            intercom or camera (its doorbell). Null otherwise, and when the caller does not see that
            device. Apps leave such a device out of a room's devices they cannot control. A driver
            before 1.10.1 sends no `part_of`: read it as null.
        part_of_music:
          type: boolean
          description: |
            Since 1.11.0 (ADR-080): true for a device this API does not control (`supported` false)
            whose Control4 driver is a Sonos driver (its file name has "sonos" in it, any case:
            Control4's `sonos.c4z`, `sonosNetwork.c4z` and `sonosGlobalLineIn.c4z` among them),
            while DirectorLink plays Sonos itself (Composer's Sonos On, `features.sonos`): the same
            players are in Music (`/v1/music`). Apps leave such a device out of a room's devices they
            cannot control; it is still listed here. False otherwise, with Sonos Off, and for a caller
            who was not given music. A driver before 1.11.0 sends no `part_of_music`: read it as false.

    DeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Device"

    Light:
      type: object
      required: [id, name, room, "on", brightness, dimmable, brightness_reported]
      properties:
        id:
          type: integer
        name:
          type: string
        room:
          oneOf:
            - $ref: "#/components/schemas/RoomRef"
            - type: "null"
        "on":
          type: boolean
        brightness:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: Brightness percent. Null for on/off lights or when unknown.
        dimmable:
          type: boolean
          description: |
            True when the light takes a level. Since 1.10.2, what the light's driver declares
            (`dimmer` or `set_level` in its capabilities) where it declares them, else whether the
            light reports a level; an on/off light takes only `on` (a brightness is refused with 409
            `NOT_SUPPORTED`).
        brightness_reported:
          type: boolean
          description: |
            False when the light does not report its level back. A KNX dimmer counts as reporting
            it once it has reported a level between 0 and 100 (1.10.2).

    LightUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      description: |
        `{"on": true}` turns the light on at its default level, `{"on": false}` turns it off and
        `{"brightness": 40}` sets the level (dimmable lights only). `"on": false` cannot be
        combined with `brightness`.
      properties:
        "on":
          type: boolean
        brightness:
          type: integer
          minimum: 0
          maximum: 100

    LightList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Light"

    Blind:
      type: object
      required: [id, name, room, position, position_reported, capabilities, moving, direction, target_position]
      properties:
        id:
          type: integer
        name:
          type: string
        room:
          oneOf:
            - $ref: "#/components/schemas/RoomRef"
            - type: "null"
        position:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: Percent open — 0 closed, 100 open. Null when the controller does not know it.
        position_reported:
          type: boolean
          description: False when the blind never reports its position.
        capabilities:
          type: object
          required: [position, stop]
          description: What the blind can do, from its Control4 setup; true where the controller does not say. Since 1.1.0.
          properties:
            position:
              type: boolean
              description: False when it only opens and closes fully; PATCH then takes only 0 and 100.
            stop:
              type: boolean
              description: False when it cannot be stopped while it moves.
        moving:
          type: [boolean, "null"]
          description: True while the blind moves. Null when the controller does not report its movement. Since 1.1.0.
        direction:
          oneOf:
            - type: string
              enum: [opening, closing]
            - type: "null"
          description: Which way it moves; null when it stands still or the controller does not say. Since 1.1.0.
        target_position:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: Where the blind was last sent, so while `moving` where it is going. Null when not known. Since 1.1.0.

    BlindUpdate:
      type: object
      required: [position]
      additionalProperties: false
      properties:
        position:
          type: integer
          minimum: 0
          maximum: 100
          description: Target percent open — 0 closed, 100 open.

    Camera:
      type: object
      required: [id, name, room, snapshot_href]
      properties:
        id:
          type: integer
        name:
          type: string
        room:
          oneOf:
            - $ref: "#/components/schemas/RoomRef"
            - type: "null"
        snapshot_href:
          type: string
          description: Path of the current picture, e.g. `/v1/cameras/83/snapshot`.

    Relay:
      type: object
      required: [id, name, room, state, state_reported, kind, door_state]
      properties:
        id:
          type: integer
        name:
          type: string
        room:
          oneOf:
            - $ref: "#/components/schemas/RoomRef"
            - type: "null"
        state:
          oneOf:
            - type: string
              enum: [open, closed]
            - type: "null"
          description: The relay contact (`closed` = energized). Null until the relay reports a change.
        state_reported:
          type: boolean
          description: False when DirectorLink cannot watch this relay's state.
        kind:
          type: string
          enum: [relay, door, gate, garage_door]
          description: |
            Since 1.10.0 (ADR-069): `door`, `gate` or `garage_door` for a Control4 Relay Door, Gate
            or Garage Door Controller's (also a KNX relay one drives); `relay` for a relay
            DirectorLink pulses itself, a door or a gate. A driver before 1.10.0 sends neither field:
            read that as `relay` and a null `door_state`.
        door_state:
          oneOf:
            - type: string
              enum: [open, closed, partly_open]
            - type: "null"
          description: |
            Since 1.10.0 (ADR-069): whether the door or gate is open, as its controller's Closed or
            Opened Contact says (`partly_open`: neither closed nor fully open). Null when not known:
            no contact, both contacts at once, or a relay without a controller.

    RelayUpdate:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [open, closed]

    RelayList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Relay"

    Doorbell:
      type: object
      required: [id, name, room, camera, can_open, connected, last_ring_at, last_motion_at, last_opened_at, last_access_at, events]
      properties:
        id:
          type: integer
        name:
          type: string
        room:
          oneOf:
            - $ref: "#/components/schemas/RoomRef"
            - type: "null"
        camera:
          description: The doorbell's camera; get pictures from `snapshot_href`. For a doorbell camera (1.10.0, ADR-065) it is that camera, with the same id. Null for a person who does not see cameras (ADR-054).
          oneOf:
            - type: object
              required: [id, snapshot_href]
              properties:
                id:
                  type: integer
                snapshot_href:
                  type: string
            - type: "null"
        can_open:
          type: boolean
          description: True when `POST …/open` can press the doorbell's button.
        connected:
          type: [boolean, "null"]
          description: False after the doorbell driver reported a communication failure; null until the first event, and always for a doorbell camera (ADR-065).
        last_ring_at:
          type: [string, "null"]
          format: date-time
          description: The last ring. A doorbell camera's (ADR-065) is its driver's `LAST_RING` when that is new (later than the ring before) and from two minutes behind the controller's clock to five seconds ahead of it, else when the ring reached the controller (always after the ring before); after a restart, its driver's `LAST_RING` unless that is ahead of the controller's clock.
        last_motion_at:
          type: [string, "null"]
          format: date-time
        last_opened_at:
          type: [string, "null"]
          format: date-time
          description: When the doorbell's relay last opened the gate or door (from anywhere).
        last_access_at:
          type: [string, "null"]
          format: date-time
          description: When access was last granted at the doorbell (keypad).
        events:
          type: array
          description: The last 20 events, newest first, since the driver started.
          items:
            type: object
            required: [type, at]
            properties:
              type:
                type: string
                enum: [doorbell, motion, opened, access, communication_failed]
              at:
                type: string
                format: date-time

    DoorbellList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Doorbell"

    MusicList:
      type: object
      required: [enabled, status, items]
      properties:
        enabled:
          type: boolean
          description: The **Sonos** property of DirectorLink is On in Composer.
        status:
          type: string
          enum: ["off", searching, ok, not_found, unreachable]
          description: |
            `off` (Sonos is Off), `searching` (looking for players), `ok`, `not_found` (no player
            found: set **Sonos Address** in Composer) or `unreachable` (none answers).
        items:
          type: array
          description: Sorted by name. Empty while Sonos is Off.
          items:
            $ref: "#/components/schemas/MusicRoom"
        groups:
          type: array
          description: The groups as Sonos has them (1.8.0), by their coordinator's name; missing while Sonos is Off and before 1.8.0.
          items:
            $ref: "#/components/schemas/MusicGroup"

    MusicGroup:
      type: object
      description: |
        A Sonos group (a room on its own is a group of one). A member (ADR-054) gets the groups with
        a Sonos room they see, naming only those: `volume` is theirs, and when the coordinator is not
        theirs, `id` and `now_playing.art_href` are those of the first of their rooms.
      required: [id, rooms, state, volume, now_playing]
      properties:
        id:
          type: string
          description: Its coordinator's id, which play, pause and skip go to.
        rooms:
          type: array
          description: Its rooms' ids, the coordinator first.
          items:
            type: string
        state:
          type: string
          enum: [playing, paused, stopped, transitioning, unknown]
        volume:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: The average of its rooms' volumes; null while none is read.
        now_playing:
          description: What it plays, as in `MusicRoom`.
          oneOf:
            - type: object
            - type: "null"

    MusicJoin:
      type: object
      required: [with]
      additionalProperties: false
      properties:
        with:
          type: string
          pattern: "^RINCON_[0-9A-Fa-f]+$"
          description: A Sonos room of the group to join, as `GET /v1/music` lists it (never an address).

    MusicGroupVolume:
      type: object
      required: [volume]
      additionalProperties: false
      properties:
        volume:
          type: integer
          minimum: 0
          maximum: 100

    MusicRoom:
      type: object
      description: A Sonos room, as last read.
      required: [id, name, room_id, room_match, group, state, volume, muted, now_playing, can_skip, reachable, updated_at]
      properties:
        id:
          type: string
          description: The Sonos room's id (its player's).
          example: RINCON_000E58A0000101400
        name:
          type: string
          description: The room's name in Sonos.
          example: Kitchen
        room_id:
          type: [integer, "null"]
          description: The Control4 room it is shown in; null when no room has its name and no admin picked one.
        room_match:
          oneOf:
            - type: string
              enum: [name, admin]
            - type: "null"
          description: How the room was found, by its name or an admin's pick.
        group:
          type: object
          description: |
            The Sonos group it plays in (each room on its own is a group of one). A member
            (1.8.0, ADR-054) gets only the Sonos rooms they see: the others are counted in `others`,
            `volume` is that of their rooms, and when the coordinator is not theirs, `id` is the
            first of their rooms in the group.
          required: [id, coordinator, rooms]
          properties:
            id:
              type: string
              description: The group's coordinator, which play, pause and skip go to (for a member who does not see it, one of their rooms in the group).
            coordinator:
              type: boolean
              description: This room leads the group.
            volume:
              type: [integer, "null"]
              minimum: 0
              maximum: 100
              description: The group's volume (1.8.0), the average of its rooms' own; null while none is read. Missing before 1.8.0.
            others:
              type: integer
              minimum: 0
              description: How many of the group's rooms are left out of `rooms` because the caller does not see them (1.8.0); 0 for admins. Missing before 1.8.0.
            rooms:
              type: array
              description: The group's rooms, its coordinator first (for a member, those they see).
              items:
                type: object
                required: [id, name]
                properties:
                  id:
                    type: string
                  name:
                    type: string
        state:
          type: string
          enum: [playing, paused, stopped, transitioning, unknown]
          description: The group's, as last read.
        volume:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: This room's own volume.
        muted:
          type: [boolean, "null"]
        now_playing:
          oneOf:
            - type: object
              required: [kind, title, artist, album, station, source, art_href, art_key]
              properties:
                kind:
                  type: string
                  enum: [music, radio, connect, tv, line_in]
                  description: |
                    `music` (the queue: a track, a playlist), `radio`, `connect` (another app plays
                    through the speaker: Spotify Connect, AirPlay), `tv` or `line_in`.
                title:
                  type: [string, "null"]
                artist:
                  type: [string, "null"]
                album:
                  type: [string, "null"]
                station:
                  type: [string, "null"]
                  description: The radio station's name.
                source:
                  type: [string, "null"]
                  description: The app playing through the speaker (`connect`), e.g. Spotify.
                art_href:
                  type: [string, "null"]
                  description: "`GET` it for the picture (`/v1/music/{musicId}/art`); null when the player has none."
                art_key:
                  type: [string, "null"]
                  description: Changes when the picture does.
            - type: "null"
          description: What the group plays; null when nothing is known or set.
        can_skip:
          type: boolean
          description: Next and previous work (not on the radio).
        reachable:
          type: boolean
          description: False while its player does not answer.
        updated_at:
          type: [string, "null"]
          format: date-time
          description: When it was last read.

    MusicUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        volume:
          type: integer
          minimum: 0
          maximum: 100
        muted:
          type: boolean

    MusicPlacement:
      type: object
      required: [room_id]
      additionalProperties: false
      properties:
        room_id:
          type: [integer, "null"]
          minimum: 1
          description: A room of the project, or null for the room of the same name.

    MusicFavoriteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, title, description, playable]
            properties:
              id:
                type: string
                pattern: "^[0-9]{1,9}$"
              title:
                type: string
              description:
                type: [string, "null"]
                description: What Sonos says it is (`TuneIn Station`, `Spotify Playlist`).
              playable:
                type: boolean
                description: False for shortcuts only the Sonos app starts.

    AlarmStatus:
      type: object
      required: [enabled, partitions]
      properties:
        enabled:
          type: boolean
          description: The **Alarm Status** property of DirectorLink is On in Composer.
        partitions:
          type: array
          description: Sorted by name. Empty while Alarm Status is Off.
          items:
            $ref: "#/components/schemas/AlarmPartition"

    AlarmPartition:
      type: object
      description: One partition of the alarm, as its panel last reported it. Read-only.
      required: [id, name, room, state, armed, armed_mode, armed_type, alarm, alarm_type, open_zones, delay, trouble]
      properties:
        id:
          type: integer
        name:
          type: string
        room:
          oneOf:
            - $ref: "#/components/schemas/RoomRef"
            - type: "null"
        state:
          type: [string, "null"]
          description: |
            What the partition is doing, in the panel's words in lower case: `disarmed_ready`,
            `disarmed_not_ready` (a zone is open), `armed`, `exit_delay`, `entry_delay`, `alarm`,
            `confirmation_required` or `offline`; a panel may report others. Null until it reports.
          example: disarmed_ready
        armed:
          type: boolean
          description: Armed, home or away (also during an entry delay).
        armed_mode:
          oneOf:
            - type: string
              enum: [home, away]
            - type: "null"
          description: Armed while people are home (stay) or away; null when not armed or not said.
        armed_type:
          type: [string, "null"]
          description: The panel's own name for how it is armed (e.g. `Stay`, `Night`), as the panel writes it; null when not armed.
          example: Away
        alarm:
          type: boolean
          description: The alarm is going off.
        alarm_type:
          type: [string, "null"]
          description: What kind of alarm (e.g. `Fire`, `Burglary`), as the panel writes it; null when not in alarm.
          example: Burglary
        open_zones:
          type: [integer, "null"]
          minimum: 0
          description: Zones (doors, windows, sensors) open now.
        delay:
          oneOf:
            - type: object
              description: An entry or exit delay is counting down.
              required: [type, remaining, total]
              properties:
                type:
                  oneOf:
                    - type: string
                      enum: [entry, exit]
                    - type: "null"
                remaining:
                  type: [integer, "null"]
                  minimum: 0
                  description: Seconds left, as the panel last reported.
                total:
                  type: [integer, "null"]
                  minimum: 0
                  description: The delay's length in seconds.
            - type: "null"
        trouble:
          type: [string, "null"]
          description: The panel's trouble text (e.g. a lost power supply or a low battery), as it writes it; null when there is none.

    CameraList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Camera"

    BlindList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Blind"

    ThermostatMode:
      type: string
      enum: ["off", heat, cool, auto]

    FanSpeed:
      type: string
      enum: [low, medium, high, auto, "on", circulate]

    Thermostat:
      type: object
      required:
        - id
        - name
        - room
        - online
        - current_temperature
        - target_temperature
        - target_temperature_min
        - target_temperature_max
        - mode
        - modes
        - activity
        - fan_speed
        - fan_speeds
        - setpoints
        - heat_setpoint
        - cool_setpoint
        - setpoint_deadband
        - last_mode
      properties:
        id:
          type: integer
        name:
          type: string
        room:
          oneOf:
            - $ref: "#/components/schemas/RoomRef"
            - type: "null"
        online:
          type: boolean
        current_temperature:
          type: [number, "null"]
          description: Degrees Celsius; null when the thermostat reports none (since 1.10.2 a value left at 0 is not reported, never 0°).
        target_temperature:
          type: [number, "null"]
          description: Degrees Celsius. On dual-setpoint thermostats, the setpoint of the current mode (null in auto and off). Null when the thermostat reports none (since 1.10.2 a setpoint left at 0 °F, or -17.8 °C, is not reported).
        target_temperature_min:
          type: number
          description: Applies to `target_temperature`, `heat_setpoint` and `cool_setpoint`. 5 on floor heating set through its heat setpoint.
        target_temperature_max:
          type: number
          description: Applies to `target_temperature`, `heat_setpoint` and `cool_setpoint`.
        mode:
          type: [string, "null"]
          description: Current mode as reported, e.g. `off`, `heat`, `cool`, `auto`.
        modes:
          type: array
          description: Modes that can be set with PATCH.
          items:
            $ref: "#/components/schemas/ThermostatMode"
        activity:
          type: [string, "null"]
          description: What the zone is doing now, e.g. `idle`, `heating`, `cooling`, `fan`.
        fan_speed:
          type: [string, "null"]
        fan_speeds:
          type: array
          description: Fan speeds that can be set with PATCH. Empty when the zone has no fan control.
          items:
            $ref: "#/components/schemas/FanSpeed"
        setpoints:
          type: string
          enum: [single, dual]
          description: |
            `single`: one target temperature. `dual`: separate heat and cool setpoints
            (`heat_setpoint`, `cool_setpoint`); `target_temperature` is then the setpoint the current
            mode uses (heat or cool) and null in auto and off.
        heat_setpoint:
          type: [number, "null"]
          description: Degrees Celsius. Dual-setpoint thermostats with a heat or auto mode; null otherwise.
        cool_setpoint:
          type: [number, "null"]
          description: Degrees Celsius. Dual-setpoint thermostats with a cool or auto mode; null otherwise.
        setpoint_deadband:
          type: [number, "null"]
          description: Degrees Celsius, the smallest gap the thermostat keeps between its heat and cool setpoints. Null when not reported and on single-setpoint thermostats. When not reported, cool must still be above heat (by 1 °F in a Fahrenheit project, 0.1 °C otherwise).
        last_mode:
          type: [string, "null"]
          description: The last mode the thermostat was in that was not off (its current one while it is on), as `mode` names it, wherever it was set (Control4's apps, a keypad, Composer programming, DirectorLink); null until DirectorLink has seen it in one. What a scene's `mode` `on` and a command that turns the AC on bring it back to. Since 1.10.0 (ADR-070); missing before.
        scale:
          type: string
          enum: [C, F]
          description: The scale the thermostat works in, as Control4 reports it (its scale variable, else the project's, else the one its temperature is reported in). Clients show it in this scale; a `F` one has the `*_f` fields. Since 1.10.2 (ADR-076); missing before (then °C).
        sensor:
          type: boolean
          description: A temperature (and humidity) reading with nothing to set, such as a temperature sensor on the thermostat proxy; `modes` and `fan_speeds` are empty, `mode` and the setpoints null, PATCH answers 409 and scene steps for its room leave it out. Since 1.10.2; missing before.
        humidity:
          type: number
          description: Relative humidity in %, when a sensor reports one. Since 1.10.2; missing otherwise.
        current_temperature_f:
          type: [number, "null"]
          description: "`scale: F` only: `current_temperature` in °F, as reported (to 0.1). Since 1.10.2."
        target_temperature_f:
          type: [number, "null"]
          description: "`scale: F` only: `target_temperature` in whole °F, as the thermostat takes it. Since 1.10.2."
        target_temperature_min_f:
          type: integer
          description: "`scale: F` only: the range in whole °F, inside the °C one (16–32 °C is 61–89 °F). Since 1.10.2."
        target_temperature_max_f:
          type: integer
          description: "`scale: F` only. Since 1.10.2."
        heat_setpoint_f:
          type: [number, "null"]
          description: "`scale: F` only: `heat_setpoint` in whole °F. Since 1.10.2."
        cool_setpoint_f:
          type: [number, "null"]
          description: "`scale: F` only: `cool_setpoint` in whole °F. Since 1.10.2."
        setpoint_deadband_f:
          type: [number, "null"]
          description: "`scale: F` only: `setpoint_deadband` in °F. Since 1.10.2."

    ThermostatUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        mode:
          $ref: "#/components/schemas/ThermostatMode"
        target_temperature:
          type: number
          description: Degrees Celsius, between `target_temperature_min` and `target_temperature_max`.
        fan_speed:
          $ref: "#/components/schemas/FanSpeed"
        heat_setpoint:
          type: number
          description: Degrees Celsius, between `target_temperature_min` and `target_temperature_max`. Dual-setpoint thermostats only (409 `NOT_SUPPORTED` otherwise). The cool setpoint moves up with it when needed to keep `setpoint_deadband`.
        cool_setpoint:
          type: number
          description: Degrees Celsius, as `heat_setpoint`; the heat setpoint moves down with it when needed.
        target_temperature_f:
          type: number
          description: "`target_temperature` in °F (since 1.10.2), between `target_temperature_min_f` and `target_temperature_max_f` (the °C range in whole °F, inside it); a °F thermostat gets exactly a whole °F sent. Not with `target_temperature`."
        heat_setpoint_f:
          type: number
          description: "`heat_setpoint` in °F (since 1.10.2). Not with `heat_setpoint`."
        cool_setpoint_f:
          type: number
          description: "`cool_setpoint` in °F (since 1.10.2). Not with `cool_setpoint`."

    ThermostatList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Thermostat"

    Fan:
      type: object
      required: [id, name, room, "on", speed, speeds]
      description: A fan on the Control4 fan proxy (since 1.2.0).
      properties:
        id:
          type: integer
        name:
          type: string
        room:
          oneOf:
            - $ref: "#/components/schemas/RoomRef"
            - type: "null"
        "on":
          type: boolean
        speed:
          type: [integer, "null"]
          minimum: 1
          maximum: 4
          description: How fast the fan runs, from 1 (low) to 4 (high). Null while it is off, and when the controller reports no speed.
        speeds:
          type: array
          description: The speeds PATCH takes, lowest first (1 low, 2 medium, 3 medium high, 4 high).
          items:
            type: integer
            minimum: 1
            maximum: 4

    FanUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      description: |
        `{"on": true}` turns the fan on at the speed it chooses (its preset speed, or the last
        one), `{"on": false}` turns it off, and `{"speed": 3}` sets the speed, turning the fan on
        if it is off. `"on": false` cannot be combined with `speed`.
      properties:
        "on":
          type: boolean
        speed:
          type: integer
          minimum: 1
          maximum: 4

    FanList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Fan"

    RefrigeratorFeature:
      type: string
      enum: [power_cool, power_freeze, sabbath_mode, ice_maker]

    Refrigerator:
      type: object
      required:
        - id
        - name
        - room
        - online
        - fridge_temperature
        - fridge_setpoint
        - freezer_temperature
        - freezer_setpoint
        - door_open
        - water_filter_usage
        - power_cool
        - power_freeze
        - sabbath_mode
        - ice_maker
        - features
        - features_reported
      description: |
        A Samsung refrigerator (since 1.7.0). Temperatures and setpoints are in °C to 0.1 (a
        refrigerator set to °F is converted), null when it does not report them. A driver that does
        not say what the refrigerator reports (`features_reported` false) starts every value at 0:
        then an exact 0 is taken as not reported, except a freezer's in °F.
      properties:
        id:
          type: integer
        name:
          type: string
        room:
          oneOf:
            - $ref: "#/components/schemas/RoomRef"
            - type: "null"
        online:
          type: boolean
          description: Samsung's cloud reaches the refrigerator. False until its driver has read it, and while the driver is not signed in to SmartThings.
        fridge_temperature:
          type: [number, "null"]
        fridge_setpoint:
          type: [number, "null"]
        freezer_temperature:
          type: [number, "null"]
        freezer_setpoint:
          type: [number, "null"]
        door_open:
          type: [boolean, "null"]
          description: A door is open, as read at the driver's poll interval. Null when the refrigerator has no door sensor.
        water_filter_usage:
          type: [number, "null"]
          description: How much of the water filter is used, in percent. Null without one.
        power_cool:
          type: [boolean, "null"]
          description: Fast cooling. Null when the refrigerator does not have it.
        power_freeze:
          type: [boolean, "null"]
          description: Fast freezing. Null when the refrigerator does not have it.
        sabbath_mode:
          type: [boolean, "null"]
          description: Sabbath mode. Null when the refrigerator does not have it.
        ice_maker:
          type: [boolean, "null"]
          description: The ice maker. Null when the refrigerator does not have one.
        features:
          type: array
          description: The features PATCH takes. All four when its driver does not say which it has (`features_reported` false).
          items:
            $ref: "#/components/schemas/RefrigeratorFeature"
        features_reported:
          type: boolean
          description: The refrigerator's driver says which features it has.

    RefrigeratorUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Any of the features, true to switch it on, false to switch it off.
      properties:
        power_cool:
          type: boolean
        power_freeze:
          type: boolean
        sabbath_mode:
          type: boolean
        ice_maker:
          type: boolean

    RefrigeratorList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Refrigerator"

    RemoteAccess:
      type: object
      required: [enabled, connected, lock, home_id]
      properties:
        enabled:
          type: boolean
          description: Remote Access is switched on in Composer.
        connected:
          type: boolean
          description: The controller's connection to api.directorlink.io is up.
        lock:
          type: boolean
          description: This controller passed the lock's self-test and can seal remote requests.
        home_id:
          type: [string, "null"]
          pattern: "^[0-9a-f]{32}$"
          description: This home's id at api.directorlink.io; null while Remote Access is off.
        update_required:
          type: boolean
          description: |
            Since 1.8.0 (ADR-059). The account service answered this version `426`
            `DRIVER_UPDATE_REQUIRED` and no connection has opened since: remote access stays down
            until DirectorLink is updated in Composer (the driver tries again hourly). False while
            Remote Access is off. Missing before 1.8.0.
        minimum_version:
          type: [string, "null"]
          pattern: "^[0-9]+[.][0-9]+[.][0-9]+$"
          description: Since 1.8.0. The oldest version the account service takes, when `update_required` is true and it named one; else null.

    ClaimToken:
      type: object
      required: [home_id, claim_token, expires_at]
      properties:
        home_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        claim_token:
          type: string
          pattern: "^[0-9a-f]{48}$"
        expires_at:
          type: string
          format: date-time

    UserList:
      type: object
      required: [device_limit, accounts_known, items, suggestions]
      properties:
        linked:
          type: boolean
          description: The account service knows this home (its relay accepted it once), so that making another admin the owner moves the home's Google or Apple account too (1.9.0, ADR-064).
        device_limit:
          type: integer
          description: The most devices a user has (5).
        accounts_known:
          type: boolean
          description: The account service has said which devices use which account (with remote access on and linked; never with an account service before 1.9.0).
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        suggestions:
          type: array
          description: For admins, the accounts whose devices are in more than one user, as the account service says; empty for anyone else.
          items:
            $ref: "#/components/schemas/MergeSuggestion"

    User:
      type: object
      required: [id, name, created_at, you, access, accounts, devices]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{8}$"
          description: The profile's id (`profile_id`).
        name:
          type: string
        created_at:
          type: string
          format: date-time
        you:
          type: boolean
          description: The caller's own user.
        access:
          $ref: "#/components/schemas/PersonAccess"
        accounts:
          type: integer
          description: How many Google or Apple accounts their devices use, as the account service says; 0 is the home network only.
        devices:
          type: array
          items:
            $ref: "#/components/schemas/UserDevice"

    UserDevice:
      type: object
      required: [id, name, created_at, last_used_at, expires_at, current, accounts, removable]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{8}$"
          description: The device's API key id.
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        current:
          type: boolean
          description: The device that asked.
        accounts:
          type: integer
          description: How many accounts use this device (2 or more is a shared device, which stays where it is).
        removable:
          type: boolean
          description: "Whether the caller may remove it (not this device: that is Forget this device)."

    LimitDevice:
      type: object
      required: [id, name, created_at, last_used_at, current, removable]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{8}$"
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
        current:
          type: boolean
        removable:
          type: boolean

    MergeSuggestion:
      type: object
      required: [id, revision, owner, keep, may_confirm, users]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: "The account's tag at this home (opaque: never the account's id or email)."
        revision:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: "A digest of what is shown: the devices in each user, and each user's role, ownership and permissions. The confirmation sends it back."
        owner:
          type: boolean
          description: "One of the users is the home's owner's: only the owner confirms, keeping the owner's user."
        keep:
          type: [string, "null"]
          pattern: "^[0-9a-f]{8}$"
          description: "The user offered to keep: the owner's; else the one whose access is within every other's (never an admin over a member); null when the admin must choose."
        may_confirm:
          type: boolean
          description: Whether the caller may confirm it.
        users:
          type: array
          description: Oldest first.
          items:
            type: object
            required: [id, name, role, owner, devices, devices_after]
            properties:
              id:
                type: string
                pattern: "^[0-9a-f]{8}$"
              name:
                type: string
              role:
                $ref: "#/components/schemas/PersonRole"
              owner:
                type: boolean
                description: The home's owner's user.
              devices:
                type: array
                description: Their devices that use the account.
                items:
                  type: string
                  pattern: "^[0-9a-f]{8}$"
              devices_after:
                type: integer
                description: How many devices this user would have if their permissions stay.

    UserMerge:
      type: object
      required: [account, keep, revision]
      additionalProperties: false
      properties:
        account:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: The suggestion's id.
        keep:
          type: string
          pattern: "^[0-9a-f]{8}$"
          description: The user whose role and permissions stay.
        revision:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: The suggestion's revision as it was shown (`409 SUGGESTION_CHANGED` when it is no longer that).

    OwnerChangeRequest:
      type: object
      required: [profile_id]
      additionalProperties: false
      properties:
        profile_id:
          type: string
          pattern: "^[0-9a-f]{8}$"
          description: The admin user who becomes the home's owner.

    OwnerChange:
      type: object
      required: [owner, previous, account_service]
      properties:
        owner:
          $ref: "#/components/schemas/UserRef"
        previous:
          $ref: "#/components/schemas/UserRef"
        account_service:
          type: string
          enum: [moved, not_claimed, not_linked]
          description: |
            `moved`: the account service moved the home's owner account to the new owner's;
            `not_claimed`: no account owns the home there; `not_linked`: the account service never
            knew this home. In the last two the change is the controller's alone.

    UserRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{8}$"
        name:
          type: string

    PairingCodeCreate:
      type: object
      additionalProperties: false
      properties:
        profile_id:
          type: string
          pattern: "^[0-9a-f]{8}$"
          description: An existing user; alone.
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: A new user's name.
        role:
          $ref: "#/components/schemas/PersonRole"
          description: A new user's role (default `member`).
        access:
          $ref: "#/components/schemas/PersonAccessUpdate"
          description: A new member's permissions.

    PairingCode:
      type: object
      required: [code, expires_at, user]
      properties:
        code:
          type: string
          pattern: "^[0-9]{4} [0-9]{4}$"
          description: Shown to the person pairing; it is also shown in Composer.
        expires_at:
          type: string
          format: date-time
        user:
          type: object
          required: [id, name, role]
          properties:
            id:
              type: [string, "null"]
              pattern: "^[0-9a-f]{8}$"
              description: The user it is for; null for a new user, made when the device pairs.
            name:
              type: string
            role:
              $ref: "#/components/schemas/PersonRole"

    InvitationCreate:
      type: object
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/KeyRole"
          description: "`admin` or `member` (with `access`); the 1.7.0 roles make the person they became (ADR-054). Required, except with `for_me` (the caller's own user's)."
        access:
          $ref: "#/components/schemas/PersonAccessUpdate"
          description: The invited member's permissions (since 1.8.0); not with `for_me`.
        expires_in:
          type: integer
          minimum: 60
          maximum: 604800
          description: Seconds until the invitation expires (default 7 days; a member's own, at most and by default 10 minutes).
        for_me:
          type: boolean
          description: For the caller's own other device (any user since 1.9.0); the new key joins the caller's user. A member's user keeps two waiting at most.
        profile_id:
          type: string
          pattern: "^[0-9a-f]{8}$"
          description: For another device of this existing user (admins, since 1.9.0); not with `for_me` or `access`.
        email:
          type: string
          maxLength: 254
          description: |
            The address of the person invited. The controller then registers the invitation with
            the account service itself before answering (`registered: true`); without it, the
            home's owner registers it from the app. A member's (`for_me`) only for an account that
            already uses the member's device at the home (`403 ACCOUNT_NOT_OF_DEVICE`).

    Invitation:
      type: object
      required: [id, role, created_at, expires_at]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{8}$"
        role:
          $ref: "#/components/schemas/KeyRole"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        created_by:
          type: string
          pattern: "^[0-9a-f]{8}$"
          description: The id of the admin key that made it; revoking or demoting that key revokes the invitation.
        for_me:
          type: boolean
          description: Made with "Add my other device" (the key joins its creator's profile).
        profile_id:
          type: string
          pattern: "^[0-9a-f]{8}$"
          description: For another device of this existing user (since 1.9.0).
        access:
          $ref: "#/components/schemas/PersonAccess"
          description: The person it makes (since 1.8.0); missing for `for_me`.

    NewInvitation:
      allOf:
        - $ref: "#/components/schemas/Invitation"
        - type: object
          required: [secret, home_id]
          properties:
            secret:
              type: string
              pattern: "^[0-9a-f]{64}$"
              description: Shown only here. Share it only inside the invitation link, after `#`.
            home_id:
              type: string
              pattern: "^[0-9a-f]{32}$"
            registered:
              type: boolean
              description: The controller registered it with the account service, for `email`.
            email:
              type: string

    InvitationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"

    LogLevel:
      type: string
      enum: [debug, info, warn, error]

    LogEntry:
      type: object
      required: [seq, time, level, category, message, data]
      properties:
        seq:
          type: integer
        time:
          type: string
          format: date-time
        level:
          $ref: "#/components/schemas/LogLevel"
        category:
          type: string
          example: api
        message:
          type: string
        data:
          type: [object, "null"]

    LogList:
      type: object
      required: [items, last_seq, level]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LogEntry"
        last_seq:
          type: integer
          description: Highest sequence number recorded so far. Pass it as `after` to poll for new entries.
        level:
          $ref: "#/components/schemas/LogLevel"

    LogSettings:
      type: object
      required: [level]
      additionalProperties: false
      properties:
        level:
          $ref: "#/components/schemas/LogLevel"

    AlertChoices:
      type: object
      required: ["on", kinds]
      properties:
        "on":
          type: boolean
          description: This key's device switched alerts on.
        kinds:
          type: object
          description: The kinds this key's role may get that this home has (a refrigerator's only once it has one; `camera` only with a camera that raises alerts (a driver of DirectorLink's camera agreement, ADR-065, or the DirectorLink · Hikvision Camera driver) that this key may see; `door_opened` with a door, a gate or a DoorBird, not for a doorbell camera alone), each wanted or not.
          properties:
            doorbell:
              type: boolean
            camera:
              type: boolean
              description: "A camera saw someone or something (1.8.0, ADR-056; ADR-065): its driver's own alert, as its settings let it through (the Hikvision drivers: the camera's Alert On, the hub's alerts switch and its snooze); at most one a camera a minute, but a smoke or CO alarm it heard (1.11.0, ADR-080) is not held back by its other alerts. Off until chosen."
            door_opened:
              type: boolean
            fridge_door:
              type: boolean
            schedule_failed:
              type: boolean
          additionalProperties: false

    AlertChoicesUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        "on":
          type: boolean
        kinds:
          type: object
          additionalProperties: false
          properties:
            doorbell:
              type: boolean
            camera:
              type: boolean
            door_opened:
              type: boolean
            fridge_door:
              type: boolean
            schedule_failed:
              type: boolean

    ActivityList:
      type: object
      required: [items, next_before]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEntry"
        next_before:
          type: [integer, "null"]
          description: Pass it as `before` for the entries that came before these; null when there are no more.

    ActivityEntry:
      type: object
      description: |
        One thing that happened. `kind` and `action`:
        - `scene`: `run` (a scene run from an app or the API), `off` (Home's Turn off all; `note`
          says lights, climate or blinds).
        - `schedule`: `run`, with `outcome` ran, skipped (`reason`) or failed; `note` is `late` for
          a run caught up after a restart, `no_weather` for one that ran without the weather, or the
          weather that started it (`heat`, `wind`, `rain`).
        - `door`: `pulse` (opened; `via` names the scene that did it), `hold` (a relay held closed,
          its door held open), `release`, `doorbell` (the gate wired to a doorbell opened). Since
          1.7.0 also `pulse` and `doorbell` with `who` `control4`: a door or gate that the device
          reported opened without DirectorLink (ADR-050); and `left_open`: a refrigerator's door open
          longer than its driver's Door Open Alert, once per opening, `who` DirectorLink (ADR-049).
        - `access`: `paired`, `created`, `role_changed` (`from`, `to`; since 1.8.0 a person's,
          `admin` or `member`, `what` their name), `permissions_changed` (1.8.0: a member's
          permissions), `room_hidden` and `room_shown` (1.8.0: a room hidden from members, or shown
          to them again), `revoked`, `forgotten` (a device removed its own key), `expired`, `joined`
          (an invitation accepted), `all_revoked` (Composer's Revoke All API Keys; `count`). Scene links (1.7.0, ADR-051): `link_created`,
          `link_replaced`, `link_removed` (`what` is the scene, `note` the link's label; `reason`
          `doors` when a change made the scene open doors or gates, `scene_gone` when the scene was
          deleted, `other_home` when it was made for another home connection, `key_gone` when the
          key that made it was revoked or expired, `no_access` (1.8.0) when that key's person is no
          longer an admin; none when an admin removed it), `links_removed`
          (all of them: Composer's Remove All Scene Links, `reason` `keys_revoked` after Revoke All
          API Keys, or `new_identity` after Reset Remote Identity; `count`; `outcome` `failed` when
          the controller could not save it, and the links still work).
        - A scene run by its link (1.7.0) is `scene` `run` with `who.type` `link`.
        - Ask to open (1.8.0, ADR-058): `door` `asked` with `who.type` `link` (its label in
          `who.name`): the link asked its person whether to open the door (`what`), on `count`
          devices; or, with `outcome` skipped, `reason` `nobody` (no device of theirs had alerts on),
          `doors_off` (Door Control off) or `not_sent`. The opening that answers it is `door`
          `pulse` by the key that answered, with `ids.link_id` and the label in `note`.
          `access` `ask_link_created`, `ask_link_replaced`, `ask_link_removed` (`what` is the door,
          `note` the label; `reason` `key_gone`, `no_access` when its person may no longer open the
          door, `door_gone`, `other_home`, or none when someone removed it).
        - Users (1.9.0, ADR-061): `access` `pairing_code` (an admin made a pairing code in the app;
          `what` the user it is for, `to` the role of a new user), `users_merged` (the devices of
          one account brought into the user `what`, from the users in `from`, `count` devices moved;
          `who` the key of the admin who confirmed it: nothing is merged by itself),
          `merge_suggested` (the account service says the devices of one account are in the users
          `what`, `count` devices: an admin may bring them together; once per suggestion, at most ten
          a day).
        - The owner (1.9.0, ADR-064): `access` `owner_changed` (the owner made the admin user `what`
          the home's owner instead of `from`).
        - `composer`: `project` (devices and rooms removed, added, renamed or moved, in `changes`),
          `setting` (a DirectorLink property changed in Composer: `what` is its name, `to` its value).
        - `system`: `backup`, `restore` (`from`: when the backup was made), `cloud_backup` (an
          automatic backup to the account, 1.6.0: `outcome` ran or failed, with `reason`; `who` is
          the key that asked for it with Back up now, or DirectorLink for the daily one, which is
          listed once a night when it fails, with `note` `retry` when it is tried again that night),
          `remote_away` (the remote connection was away for `seconds`, more than a minute; recorded
          when it is back), `driver_updated` (`from`, `to`), `driver_started` (the controller or the
          driver restarted), `driver_added`, `remote_update_required` (1.8.0: the account service no
          longer takes this version of DirectorLink for remote access; `from` this version, `to` the
          oldest it takes when it said; once until a connection opens again).
      required: [id, at, kind, action, who]
      properties:
        id:
          type: integer
          minimum: 1
          description: Increases with every entry; the cursor for `before`.
        at:
          type: string
          format: date-time
        kind:
          type: string
          enum: [scene, schedule, door, composer, access, system]
        action:
          type: string
          enum: [run, "off", pulse, hold, release, doorbell, left_open, asked, paired, created, role_changed, permissions_changed, room_hidden, room_shown, revoked, forgotten, expired, joined, all_revoked, link_created, link_replaced, link_removed, links_removed, ask_link_created, ask_link_replaced, ask_link_removed, pairing_code, users_merged, merge_suggested, owner_changed, project, setting, backup, restore, cloud_backup, remote_away, driver_updated, driver_started, driver_added, remote_update_required]
        who:
          $ref: "#/components/schemas/ActivityWho"
        what:
          type: string
          description: The scene, device, key or setting, by the name it had then.
        room:
          type: string
          description: The device's room in the Control4 project, by the name it had then.
        via:
          type: string
          description: The scene that opened the door.
        outcome:
          type: string
          enum: [ran, skipped, failed]
          description: For scenes, schedules and backups to the account (`cloud_backup`). A run that failed on a device is `failed`; one that sent nothing is `skipped`. Also `failed` for `links_removed` that the controller could not save (the links still work).
        reason:
          type: string
          enum: [shabbat, paused, calendar_off, only_if, no_weather, scene_gone, error, remote_off, account_unreachable, not_linked, too_large, limit, account_full, stopped, doors, other_home, new_identity, key_gone, keys_revoked, nobody, doors_off, not_sent, no_access, door_gone]
          description: |
            Why a schedule was skipped or failed: `shabbat` (it skips Shabbat and holidays),
            `paused` (the Schedules property in Composer), `calendar_off` (it runs only on Shabbat
            and holidays, and the Jewish calendar is off or has no location), `only_if` (its weather
            conditions were not met), `no_weather` (no weather data, and it skips without),
            `scene_gone`, `error`.

            Why a backup to the account (`cloud_backup`) was not made: `remote_off` (Remote Access
            is off in Composer), `account_unreachable` (the controller was not connected to
            DirectorLink's servers, the account service did not answer within 30 seconds, or it
            failed on its side), `not_linked` (the home is not in an account), `too_large` (larger
            than the account takes), `limit` (backed up too often today: the account starts 4 a
            UTC day per home, besides the first nightly one), `account_full` (the owner's homes
            have no room left in the account, 25 MB in all), `stopped` (automatic backups were
            turned off, or the backup password changed, while it was being made), `error`
            (anything else; the log and `GET /v1/backup/automatic`'s `last.code` say what).

            Why a scene link went (`link_removed`, 1.7.0): `doors`, `scene_gone`, `other_home`,
            `key_gone` (the key that made it was revoked or expired); and all of them
            (`links_removed`): `new_identity`, `keys_revoked` (Revoke All API Keys).

            Ask to open (1.8.0, ADR-058): why nobody was asked (`asked`): `nobody`, `doors_off`,
            `not_sent`; why a link went (`ask_link_removed`): `key_gone`, `no_access`, `door_gone`,
            `other_home`.
        note:
          type: string
          description: See `kind` for schedules and Turn off all. For a daily `cloud_backup` that failed, `retry` when it is tried again that night (every 15 minutes until 06:00).
        from:
          type: string
        to:
          type: string
        count:
          type: integer
        seconds:
          type: integer
        more:
          type: integer
          description: Changes not listed in `changes` (it lists 20).
        counts:
          type: object
          required: [ran, skipped, failed]
          properties:
            ran:
              type: integer
            skipped:
              type: integer
            failed:
              type: integer
            no_last_mode:
              type: integer
              description: Of the skipped, the ACs a scene left off because their last mode is not known yet (`NO_LAST_MODE`); only when there are some. Since 1.10.0 (ADR-070).
            on_off_only:
              type: integer
              description: Of the skipped, the on/off lights a level for a room or the whole home left as they are, as meant (`ON_OFF_ONLY`, the run's `on_off_only`); only when there are some. Since ADR-077's change of 2026-10-09.
        ids:
          type: object
          properties:
            scene_id:
              type: string
            schedule_id:
              type: string
            device_id:
              type: integer
            room_id:
              type: integer
            key_id:
              type: string
            invitation_id:
              type: string
            link_id:
              type: string
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ActivityChange"

    ActivityWho:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [key, schedule, composer, controller, control4, link]
          description: A key (an app, a device, a script), a schedule, Composer, DirectorLink itself, Control4 (1.7.0, ADR-050) for a door or gate that opened without DirectorLink (its app, a keypad, its programming, the DoorBird's own app), or a scene's link (1.7.0, ADR-051, a phone's automation; `link_id`, and `name`, its label).
        key_id:
          type: string
        link_id:
          type: string
        name:
          type: string
          description: The key's name (its device), or the link's label, as it was then.
        profile:
          type: string
          description: The person the key belongs to, as named then.
        remote:
          type: boolean
          description: True when the request came through the account, away from home.
        schedule_id:
          type: string
        trigger:
          $ref: "#/components/schemas/ScheduleTrigger"
        days:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6

    ActivityChange:
      type: object
      required: [change, type, name]
      properties:
        change:
          type: string
          enum: [removed, added, renamed, moved]
        type:
          type: string
          enum: [device, room]
        name:
          type: string
          description: The name now (the name it had, for one removed).
        room:
          type: string
          description: A device's room (the one it moved to).
        from:
          type: string
          description: The name before (renamed), or the room before (moved).

    Backup:
      type: object
      description: |
        Everything DirectorLink keeps on the controller (docs/BACKUP.md), one section per store as
        the store keeps it, with the store's version.
      required: [format, format_version, driver_version, created_at, home, composer, references, sections]
      properties:
        format:
          const: directorlink-backup
        format_version:
          type: integer
          minimum: 1
        driver_version:
          type: string
          description: The DirectorLink that made it. A newer one's backup is refused.
        created_at:
          type: string
          format: date-time
        home:
          type: object
          required: [name]
          properties:
            name:
              type: [string, "null"]
              description: The project's name (its site in Composer).
        controller_id:
          type: [string, "null"]
          pattern: "^[0-9a-f]{32}$"
          description: The controller that made it (a hash of its MAC address), null when Director does not give it. Tells a backup of this controller from one of another.
        composer:
          type: object
          description: How DirectorLink's Composer properties were set (Door Control, Relay Hold, Schedules, Jewish Calendar, Alarm Status, Remote Access, Log Level). Listed when restoring, never restored.
          additionalProperties:
            type: [string, "null"]
        references:
          type: object
          description: The rooms and devices the sections refer to, by id, as the project named them when the backup was made.
          required: [rooms, devices]
          properties:
            rooms:
              type: object
              additionalProperties:
                type: object
                required: [name]
                properties:
                  name:
                    type: string
            devices:
              type: object
              additionalProperties:
                type: object
                required: [name, kind, room_id]
                properties:
                  name:
                    type: string
                  kind:
                    type: string
                  room_id:
                    type: [integer, "null"]
        sections:
          type: object
          additionalProperties: false
          required: [keys, profiles, room_names, room_order, scenes, schedules, calendar, remote_identity]
          properties:
            keys:
              $ref: "#/components/schemas/BackupList"
            profiles:
              $ref: "#/components/schemas/BackupList"
            room_names:
              type: object
              required: [version, rooms]
              properties:
                version:
                  type: integer
                rooms:
                  type: object
                  description: Room id to language to name.
            room_order:
              $ref: "#/components/schemas/BackupList"
            scenes:
              $ref: "#/components/schemas/BackupList"
            schedules:
              $ref: "#/components/schemas/BackupList"
            calendar:
              type: object
              required: [version, settings]
              properties:
                version:
                  type: integer
                settings:
                  type: object
            remote_identity:
              type: object
              description: The home's remote identity, only when the relay has accepted it (`linked` true); otherwise only `version` and `linked` false.
              required: [version, linked]
              properties:
                version:
                  type: integer
                linked:
                  type: boolean
                home_id:
                  type: string
                  pattern: "^[0-9a-f]{32}$"
                home_secret:
                  type: string
                  pattern: "^[0-9a-f]{64}$"
                next_secrets:
                  type: array
                  description: Replacements for the secret still waiting for the owner's approval.
                  items:
                    type: object
                    required: [secret, at]
                    properties:
                      secret:
                        type: string
                        pattern: "^[0-9a-f]{64}$"
                      at:
                        type: integer
            sonos_rooms:
              type: object
              description: The rooms an admin chose for Sonos players (1.6.0); a backup without them leaves the choices on the controller as they are.
              required: [version, rooms]
              properties:
                version:
                  type: integer
                rooms:
                  type: object
                  description: Player id to the room's id and the player's name.
                  additionalProperties:
                    type: object
                    required: [room_id]
                    properties:
                      room_id:
                        type: integer
                      name:
                        type: [string, "null"]
            scene_links:
              type: object
              description: The scene links (1.7.0, ADR-051), as the controller keeps them - a hash of each secret, never the secret. They come back only with the backup's keys; a backup without them keeps the links here whose scene comes back.
              required: [version, links]
              properties:
                version:
                  type: integer
                links:
                  type: array
                  items:
                    type: object
                    required: [id, scene_id, alg, hash, home, created_at]
                    properties:
                      id:
                        type: string
                        pattern: "^[0-9a-f]{8}$"
                      scene_id:
                        type: string
                        pattern: "^[0-9a-f]{8}$"
                      label:
                        type: string
                      alg:
                        type: string
                        enum: [sha256, sha1]
                      hash:
                        type: string
                      home:
                        type: string
                        pattern: "^[0-9a-f]{32}$"
                        description: The home id the link's address names.
                      by:
                        type: string
                        pattern: "^[0-9a-f]{8}$"
                        description: The id of the key that made it; the link goes with that key.
                      created_at:
                        type: string
                      last_used_at:
                        type: string
            people:
              type: object
              description: People's roles and permissions, the home's owner and the rooms hidden from members (1.8.0, ADR-054). Like the keys - the backup's only when its keys come back, their rooms matched to the project like scene steps; else the ones here. A backup without them (before 1.8.0) has its people worked out from their keys' roles after the restore.
              required: [version, people, hidden_rooms]
              properties:
                version:
                  type: integer
                people:
                  type: object
                  description: Profile id to that person's role and permissions.
                  additionalProperties:
                    $ref: "#/components/schemas/PersonAccessUpdate"
                owner:
                  type: string
                  pattern: "^[0-9a-f]{8}$"
                  description: The profile that last claimed the home for an account.
                hidden_rooms:
                  type: array
                  items:
                    type: integer

    AutomaticBackupKey:
      type: object
      additionalProperties: false
      required: [public_key, salt, iterations, kdf]
      properties:
        public_key:
          type: string
          description: The X25519 public key made from the backup password, 32 bytes in base64.
        salt:
          type: string
          description: The 16 random bytes PBKDF2 used, in base64.
        iterations:
          type: integer
          minimum: 100000
          maximum: 5000000
        kdf:
          const: PBKDF2-SHA-256

    AutomaticBackup:
      type: object
      required: [enabled, key, time, running, last, remote]
      properties:
        enabled:
          type: boolean
        key:
          type: [object, "null"]
          description: The backup password's key, as the app set it; null while off. `public_key`, `salt`, `iterations` and `kdf` only in sealed requests.
          required: [key_id, set_at]
          properties:
            key_id:
              type: string
              pattern: "^[0-9a-f]{16}$"
              description: The public key's first 8 bytes in hex; the account lists each backup with it.
            public_key:
              type: string
            salt:
              type: string
            iterations:
              type: integer
            kdf:
              type: string
            set_at:
              type: [string, "null"]
              format: date-time
        time:
          type: [string, "null"]
          pattern: "^[0-9]{2}:[0-9]{2}$"
          description: When the daily backup is made, in the controller's time; null while off.
        running:
          type: boolean
        last:
          type: [object, "null"]
          description: How the last backup went, or the last day's that could not be made.
          required: [at, ok, size, code, why]
          properties:
            at:
              type: string
              format: date-time
            ok:
              type: boolean
            size:
              type: [integer, "null"]
              description: Bytes sent to the account.
            code:
              type: [string, "null"]
              description: Why it was not made (`REMOTE_OFFLINE`, `REMOTE_ACCESS_OFF`, `NOT_CLAIMED`, ...).
            why:
              type: [string, "null"]
              enum: [daily, now, null]
        remote:
          type: object
          required: [enabled, connected, linked]
          properties:
            enabled:
              type: boolean
              description: Remote Access is On in Composer.
            connected:
              type: boolean
            linked:
              type: boolean
              description: The relay has accepted the home's identity.

    BackupList:
      type: object
      description: "A store with its version and one list: keys (hashes and lock keys), profiles, order (room ids), scenes or schedules."
      required: [version]
      minProperties: 2
      maxProperties: 2
      properties:
        version:
          type: integer
          minimum: 1
      additionalProperties:
        type: array

    RestorePart:
      type: object
      additionalProperties: false
      required: [index, count, text]
      properties:
        upload:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: The upload the first part started; left out in the first part.
        index:
          type: integer
          minimum: 0
          description: This part's place, from 0.
        count:
          type: integer
          minimum: 1
          maximum: 100
        text:
          type: string
          minLength: 1
          description: A part of the backup's JSON text (at most 48 KiB of UTF-8).

    RestorePartReceived:
      type: object
      required: [upload, received, count, complete]
      properties:
        upload:
          type: string
          pattern: "^[0-9a-f]{16}$"
        received:
          type: integer
        count:
          type: integer
        complete:
          type: boolean
          description: Every part is in; `POST /v1/restore` can check and restore it.

    RestoreRequest:
      type: object
      additionalProperties: false
      properties:
        upload:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: A complete upload (`POST /v1/restore/parts`).
        document:
          $ref: "#/components/schemas/Backup"
        dry_run:
          type: boolean
          default: true
          description: True (the default) checks and changes nothing; false restores.
        replaces_key:
          type: string
          pattern: "^[0-9a-f]{8}$"
          description: '"This device is …": the id of one of the backup''s keys (`keys.items`) whose place the sending key takes, with its profile and role; that key is not restored. Only when the backup''s keys come back (`keys.action` `restore`).'
        move_remote:
          type: boolean
          default: false
          description: Another home's backup (`origin.another_home`) brings its remote identity here only with this; the controller it was made on must be off or reset first.
      oneOf:
        - required: [upload]
        - required: [document]

    RestoreAnswer:
      type: object
      required: [dry_run, restore]
      properties:
        dry_run:
          type: boolean
        restore:
          $ref: "#/components/schemas/RestorePreview"
        restored_at:
          type: string
          format: date-time
          description: When everything was replaced (not in a check).

    RestorePreview:
      type: object
      description: What a restore does (a check) or did.
      required: [backup, origin, counts, left_out, keys, remote, references, composer]
      properties:
        origin:
          type: object
          description: Whether the backup looks like another home's.
          required: [another_home, reasons, home_now, controller]
          properties:
            another_home:
              type: boolean
            reasons:
              type: array
              description: "`home_id`: linked to another home in the account; `controller`: made on another controller (when there is no home id to compare); `name`: the home has another name; `references`: most of what it refers to is not in this project."
              items:
                type: string
                enum: [home_id, controller, name, references]
            home_now:
              type: [string, "null"]
              description: This project's name.
            controller:
              type: string
              enum: [same, other, unknown]
              description: Whether this controller made the backup.
        backup:
          type: object
          required: [created_at, driver_version, format_version, home]
          properties:
            created_at:
              type: string
            driver_version:
              type: string
            format_version:
              type: integer
            home:
              type: [string, "null"]
        counts:
          type: object
          description: What there is after the restore.
          required: [keys, profiles, scenes, schedules, room_names, room_order]
          properties:
            keys:
              type: integer
            profiles:
              type: integer
            scenes:
              type: integer
            schedules:
              type: integer
            room_names:
              type: integer
              description: Rooms with names of DirectorLink's own.
            room_order:
              type: integer
            sonos_rooms:
              type: [integer, "null"]
              description: Sonos players with a room an admin chose (1.6.0); null when the backup has none, and the choices stay as they are.
            scene_links:
              type: integer
              description: Scene links after the restore (1.7.0, ADR-051). Like the keys - the backup's only when its keys come back (keys.action restore; from a backup made before links, the ones here), else the ones here, so a link removed or replaced since the backup was made never comes back. Each only while its scene comes back without doors or gates, the home's identity in use is the one it was made for, and the key that made it is among the keys after the restore.
            people:
              type: integer
              description: People with a role of their own after the restore (1.8.0, ADR-054); the others are worked out from their keys' roles afterwards.
        left_out:
          type: object
          description: What the backup has that is left out, not valid or with nothing left to act on (steps whose devices or room match nothing, schedules whose scene is not in the backup).
          required: [scenes, steps, schedules, profiles]
          properties:
            scenes:
              type: integer
            steps:
              type: integer
            schedules:
              type: integer
            profiles:
              type: integer
        keys:
          type: object
          required: [action, count, in_backup, items, replaced, yours, conflict, expired, left_out, over_limit, limit]
          properties:
            action:
              type: string
              enum: [restore, kept]
              description: "`restore`: the backup's keys come back (no other key is paired, and the sending key was paired after the backup was made). `kept`: every key stays as it is now."
            count:
              type: integer
            in_backup:
              type: integer
              description: Key records in the backup.
            items:
              type: array
              description: The backup's keys that come back, by name and role (none while kept).
              items:
                type: object
                required: [id, name, role, expires_at]
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  role:
                    type: string
                  expires_at:
                    type: [string, "null"]
            replaced:
              type: [object, "null"]
              description: The backup's key whose place the sending key took (`replaces_key`).
              required: [id, name, role]
              properties:
                id:
                  type: string
                name:
                  type: string
                role:
                  type: string
            yours:
              type: string
              enum: [added, kept]
              description: The key that sends the restore stays as it is now; `added` to the backup's keys, or `kept` with the others.
            conflict:
              type: boolean
              description: The backup has another key with this key's id; the one in use is kept.
            expired:
              type: integer
              description: Keys whose expiry has passed, left out.
            left_out:
              type: integer
            over_limit:
              type: boolean
              description: More keys than the limit; new devices can pair once some are removed.
            limit:
              type: integer
        remote:
          type: object
          required: [action, home_id, current_home_id, remote_access, old_controller]
          properties:
            action:
              type: string
              enum: [same, restore, kept, none]
              description: "`same`: the home in use stays. `restore`: the backup's home is used from a few seconds after the answer; if the relay refuses it, the controller's own comes back. `kept`: another home's identity stays out (`move_remote` brings it). `none`: the backup holds no identity; the one in use stays."
            home_id:
              type: [string, "null"]
              pattern: "^[0-9a-f]{32}$"
            current_home_id:
              type: [string, "null"]
            remote_access:
              type: boolean
            old_controller:
              type: boolean
              description: The backup's identity is used here and the controller it was made on may still run with it; the two would push each other off the relay.
        references:
          type: object
          required: [by_id, by_name, renamed, unmatched, unmatched_count]
          properties:
            by_id:
              type: integer
              description: Rooms and devices found by their id.
            by_name:
              type: array
              description: Found by the same name in the same room.
              items:
                type: object
                required: [kind, name, room, from, to]
                properties:
                  kind:
                    type: string
                  name:
                    type: string
                  room:
                    type: [string, "null"]
                  from:
                    type: integer
                  to:
                    type: integer
            renamed:
              type: array
              description: Found by id, with another name now.
              items:
                type: object
                required: [kind, id, name, now]
                properties:
                  kind:
                    type: string
                  id:
                    type: integer
                  name:
                    type: string
                  now:
                    type: string
            unmatched:
              type: array
              description: Rooms and devices that match nothing (the first 100), with where the backup used them. What used them is left out.
              items:
                type: object
                required: [kind, id, name, room, now, used_in]
                properties:
                  kind:
                    type: string
                    description: room, or light, climate, fan, blind, relay, camera, doorbell.
                  id:
                    type: integer
                  name:
                    type: [string, "null"]
                  room:
                    type: [string, "null"]
                  now:
                    type: [string, "null"]
                    description: What the id is called now, when it is still such a room or device (a door or gate renamed or swapped is not moved).
                  used_in:
                    type: array
                    items:
                      type: object
                      required: [section]
                      properties:
                        section:
                          type: string
                          enum: [scenes, profiles, room_names, room_order, sonos_rooms]
                        name:
                          type: [string, "null"]
                          description: The scene's or profile's name, or the Sonos player's.
            unmatched_count:
              type: integer
        composer:
          type: array
          description: DirectorLink's Composer properties as the backup has them and as they are now. A restore never sets them.
          items:
            type: object
            required: [name, backup, current]
            properties:
              name:
                type: string
              backup:
                type: [string, "null"]
              current:
                type: [string, "null"]
