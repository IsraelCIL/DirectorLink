        and Garage Door Controllers, each under its button's id, in its room, with `kind` and, when
        the controller has a contact, `door_state`. A controller whose Open relay is a KNX
        Contact/Relay DirectorLink lists is that relay's door (its id, name and room, the
        controller's kind and state), not a second one. A controller with nothing bound to its Open
        relay is not listed.
      parameters:
        - $ref: "#/components/parameters/RoomIdQuery"
      responses:
