      description: The code in use stops working, whoever made it (since 1.9.0).
      responses:
        "204":
          description: Closed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

