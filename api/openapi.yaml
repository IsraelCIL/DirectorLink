              name: Good night
              icon: moon
              show_on_home: true
              steps:
                - type: lights
                  set: { "on": false }
                - type: climate
                  room_id: 11
                  set: { mode: cool, target_temperature: 24, fan_speed: low }
                - type: lights
                  room_id: 11
                  device_ids: [22]
                  set: { brightness: 10 }
