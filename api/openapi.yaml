      operationId: deleteScene
      x-directorlink-role: admin
      summary: Delete a scene
      description: A scene that schedules run is not deleted (409 `SCENE_IN_USE`); change or delete them first.
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/scenes/{sceneId}/run:
    parameters:
      - $ref: "#/components/parameters/SceneId"
    post:
      tags: [Scenes]
      operationId: runScene
      x-directorlink-role: member
      summary: Run a scene
      description: |
        Sends every step's commands, in order, and says what happened to each device. A member runs
        only the scenes an admin chose for them (another answers 404), in full: even devices they
        could not control themselves (ADR-054). Doors and gates are pulsed only while Door Control
        is on (else skipped with `DOOR_CONTROL_DISABLED`; when DirectorLink runs a scene itself,
        from a schedule or a link, always skipped with `FORBIDDEN`), and the rest of the scene
        still runs.
      responses:
        "202":
          description: The commands were handed to the controller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/scene-links:
    get:
      tags: [Scenes]
      operationId: listSceneLinks
      x-directorlink-role: admin
      summary: List the scene links
      description: |
        Since 1.7.0 (ADR-051). Every scene that has a link for the phone's own automations, with
        its scene's name, its label, when it was made and when it last ran; never a secret. Also
        what a link needs to work: `remote_access` (the Composer property) and `home_linked` (the
        account service has accepted this home). Links whose scene is gone or now opens doors or
        gates, that were made for another home connection, or whose key (`made_by`) was revoked or
        expired, go before the list is made.
      responses:
        "200":
          description: The links.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneLinkList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/scenes/{sceneId}/link:
    parameters:
      - $ref: "#/components/parameters/SceneId"
    get:
      tags: [Scenes]
      operationId: getSceneLink
      x-directorlink-role: admin
      summary: Get a scene's link
      description: Since 1.7.0 (ADR-051). The scene's link, without its secret; 404 when it has none.
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneLink"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Scenes]
      operationId: createSceneLink
      x-directorlink-role: admin
      summary: Make a scene's link
      description: |
        Since 1.7.0 (ADR-051). A new private link for the scene, for the phone's own automations
        (iPhone Shortcuts, Android automation apps, an NFC tag). It replaces the scene's link, which
        stops working at once. The answer is the only place its `secret` ever appears: the controller
        keeps a hash of it, as of API keys. A phone runs the scene with a POST to `url` without what
        follows `#`, with the secret in the body (docs/SCENES.md); the account service passes it to
        the home (`link`, docs/RELAY.md), and the scene runs as DirectorLink itself runs it, as a
        schedule does (before 1.8.0: as a member's key would).

        Refused for a scene that opens doors or gates (409 `SCENE_OPENS_DOORS`: a step of a type a
        link may not run; only lights, climate, fans, blinds, music and refrigerators may), while
        Remote Access is off (409 `REMOTE_ACCESS_OFF`), and before the account service has accepted
        the home (409 `HOME_NOT_LINKED`). A scene changed to open doors or gates loses its link. The
        link goes with the key that makes it (`made_by`): revoking that key, or its expiry, removes
        it.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneLinkCreate"
            example:
              label: Arriving home
      responses:
        "201":
          description: The new link, with its secret, shown this once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneLinkCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [Scenes]
      operationId: deleteSceneLink
      x-directorlink-role: admin
      summary: Remove a scene's link
      description: Since 1.7.0 (ADR-051). The link stops working at once. The Composer action Remove All Scene Links removes every one. While the stored links could not be read, `503 UNAVAILABLE` (nothing is written until they can).
      responses:
        "204":
          description: Removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/ask-links:
    get:
      tags: [Relays]
      operationId: listAskLinks
      x-directorlink-role: member
      summary: List the ask-to-open links
      description: |
        Since 1.8.0 (ADR-058). The links that ask their person to open a door or gate: the ones made
        by this key's person (an admin gets every one), each with its door, its label, the person it
        asks, when it was made and when it last ran; never a secret. Since 1.9.0 (ADR-062) also the
        device each was made on (`device`) and whether it is one of this user's (`this_user`), so
        that a user sees and removes the links of all their devices. Also what a link needs to work:
        `remote_access`, `home_linked` and `door_control` (the Composer property). Links made for
        another home connection, whose key (`made_by`) is gone, whose person may no longer open the
        door, or whose door is gone, go before the list is made.
      responses:
        "200":
          description: The links.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskLinkList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Relays]
      operationId: createAskLink
      x-directorlink-role: member
      summary: Make an ask-to-open link
      description: |
        Since 1.8.0 (ADR-058). A private link for the phone's own automations (iPhone Shortcuts when
        arriving, Siri, an Android app) that never opens anything: its run (`/run/<home>.<link>`,
        as a scene link's, docs/SCENES.md) makes the controller ask this key's person, by a sealed
        alert to their devices that have alerts on, whether to open the door; tapping it opens the
        app's question, whose Open is `POST /v1/relays/{relayId}/pulse` with the request's id. One
        link per door and key: a new one replaces this key's link for that door, which stops working
        at once. The answer is the only place its `secret` ever appears.

        Only for a key that may open the door (403 `FORBIDDEN`), with Door Control on (403
        `DOOR_CONTROL_DISABLED`), Remote Access on (409 `REMOTE_ACCESS_OFF`) and the home accepted by
        the account service (409 `HOME_NOT_LINKED`); at most 50 links (409
        `ASK_LINK_LIMIT_REACHED`). The link goes with the key that made it (revoked or expired), when
        its person may no longer open the door, and with Composer's Remove All Scene Links, Revoke
        All API Keys and Reset Remote Identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskLinkCreate"
            example:
              relay_id: 70
              label: Arriving home
      responses:
        "201":
          description: The new link, with its secret, shown this once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskLinkCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/ask-links/{linkId}:
    parameters:
      - name: linkId
        in: path
