  /v1/thermostats/{thermostatId}:
    parameters:
      - $ref: "#/components/parameters/ThermostatId"
    get:
      tags: [Thermostats]
      operationId: getThermostat
      x-directorlink-role: member
      summary: Get a thermostat
      responses:
        "200":
          description: The thermostat and its current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thermostat"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Thermostats]
      operationId: updateThermostat
      x-directorlink-role: member
      summary: Change mode, target temperature, heat/cool setpoints or fan speed
      description: >-
        Fields are applied in the order mode, fan speed, then the temperature: `target_temperature`,
        or `heat_setpoint` and `cool_setpoint` on dual-setpoint thermostats (`setpoints: dual`).
        There, `target_temperature` sets the setpoint of the mode (the one in this request, else
        the current one) and is refused in auto and off (409 `NOT_SUPPORTED`). One setpoint moves
        the other when needed to keep `setpoint_deadband`; both together must already be that far
        apart (400 `INVALID_FIELD`); `target_temperature` with a setpoint is 400 `INVALID_REQUEST`.
        Nothing is sent when a request is refused. Auto example:
        `{"mode": "auto", "heat_setpoint": 20, "cool_setpoint": 24}`. Since 1.10.2 each temperature
        may be sent in °F instead (`target_temperature_f`, `heat_setpoint_f`, `cool_setpoint_f`, not
        with its °C field): a °F thermostat gets exactly that °F, e.g. `{"target_temperature_f": 69}`.
        A temperature sensor (`sensor: true`) has nothing to set: 409 `NOT_SUPPORTED`.
      requestBody:
        required: true
        content:
