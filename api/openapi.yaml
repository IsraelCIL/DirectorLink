  /v1/profiles/{profileId}/access:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    get:
      tags: [Profiles]
      operationId: getPersonAccess
      x-directorlink-role: admin
      summary: A person's role and permissions
      description: Admin or member, and what a member may see and do (since 1.8.0, ADR-054).
      responses:
        "200":
          description: The person's role and permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonAccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Profiles]
      operationId: updatePersonAccess
      x-directorlink-role: admin
      summary: Set a person's role and permissions
      description: |
        Any of the fields; the others keep their values (for a person without a record yet, those of
        what their keys' 1.7.0 role became; for a member that needs the scenes, `503 UNAVAILABLE`
        while they could not be read). Every key of the person follows at once, at home and away;
        their 1.7.0 `role` is saved first, and when it cannot be, nothing changes (`500`). Rooms must
        be the home's and scenes its scenes. Only the home's owner changes the owner's, and only the
        owner makes a person an admin who would then be the owner (`403 OWNER_PROTECTED`); the owner
        stays an admin (`409 OWNER_STAYS_ADMIN`); there is always an admin (`409 LAST_ADMIN`). While
        DirectorLink could not read who the owner is when it started, admins' and new admins' wait
        (`503 UNAVAILABLE`). A person no longer an admin keeps no invitation their devices made, nor
        scene links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonAccessUpdate"
            example:
              role: member
              all_rooms: false
              rooms: [10, 12]
              kinds:
                music: false
              doors: false
              scenes: ["a1b2c3d4"]
      responses:
        "200":
          description: The person's role and permissions after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonAccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      x-directorlink-role: member
      summary: Users and their devices (Settings → Users)
      description: |
        Since 1.9.0 (ADR-061). Each user with their name, role and permissions (`access`, as
        `GET /v1/profiles/{profileId}/access` has it), how many Google or Apple accounts their devices
        use (as the account service says; a user without one uses DirectorLink on the home network
        only), and every device: when it was last used, whether it is this one, and whether the
        caller may remove it (`DELETE /v1/api-keys/{keyId}`). Admins see every user and the
        suggestions to bring an account's devices together (what the account service says: nothing
        moves until an admin confirms it, `POST /v1/users/merge`); anyone else only their own user.
      responses:
        "200":
          description: The users the caller sees.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/users/merge:
    post:
      tags: [Users]
      operationId: mergeUsers
      x-directorlink-role: admin
      summary: Bring the devices of one account into one user
      description: |
        Confirms a suggestion of `GET /v1/users` (1.9.0, ADR-061), as it was shown (`revision`): the
        devices that use that account move to `keep`, whose role and permissions (and language,
        theme and favorites) they then have; a device that is no longer an admin's loses the
        invitations it made; a user left without devices goes, and their favorites are added to
        `keep`'s. DirectorLink never does this by itself. When the account service has changed which
        devices share that account since, or anyone changed those users' roles or permissions, nothing
        moves: `409 SUGGESTION_CHANGED` (look again). With the owner's user, only the owner confirms
        (`403 OWNER_PROTECTED`), and the owner's user is the one that stays (`400 INVALID_FIELD`); at
        most five devices (`409 USER_DEVICE_LIMIT`, with the devices); there is always an admin
        (`409 LAST_ADMIN`). `404` when the suggestion is no longer there.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserMerge"
            example:
              account: "3f9a1c2e7b4d5a60"
              keep: "a1b2c3d4"
              revision: "9c41d0e2b7a35f68"
      responses:
        "200":
          description: The user who stays, as `GET /v1/users` lists them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/users/owner:
    post:
      tags: [Users]
      operationId: makeOwner
      x-directorlink-role: admin
      summary: Make another admin the home's owner
      description: |
        Since 1.9.0 (ADR-064): the home's owner makes another admin user the owner; only the owner
        may (`403 OWNER_ONLY`), and only an admin (`409 NOT_AN_ADMIN`: make a member an admin first),
        not themself (`409 ALREADY_OWNER`). The owner's rules (ADR-054) then follow the new owner:
        only they change their own access and devices, claim the home again and confirm bringing
        the owner's devices together. The old owner stays an admin, like any other, and nobody is
        removed. A home the account service knows (Remote Access, once linked) moves there too: the
        controller asks it, over its own connection (`owner`, docs/RELAY.md), to move the home's
        owner account to the new owner's Google or Apple account, and records the new owner only
        once it has, or when no account owns the home there (`account_service`). The account is the
        one the new owner's devices of one account all use: `409 OWNER_ACCOUNT_UNCLEAR` when they use
        several, `409 OWNER_ACCOUNT_SHARED` when it is also used by the owner's own devices (both with
        `device_names`, the devices in question; nothing is asked). Otherwise nothing moves:
        `409 OWNER_NEEDS_ACCOUNT` (the new owner's devices use no account of the home: invite their
        account first, and they accept it), `409 REMOTE_ACCESS_OFF`, `503 REMOTE_OFFLINE` (not
        connected: nothing was asked), `503 REMOTE_TIMEOUT` (no answer within 10 s: the account
        service is told to undo whatever it did, `owner_cancel`; try again), `502` with the account
        service's code. When the controller cannot follow what the account service did (the users
        changed meanwhile, or the store could not be written), it tells it to undo that move. In
        History as `access` `owner_changed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerChangeRequest"
            example:
              profile_id: "a1b2c3d4"
      responses:
        "200":
          description: The new owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerChange"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: The new owner could not be saved; nothing changed (and the account service was told to undo its move).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          $ref: "#/components/responses/CommandFailed"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/pairing-code:
    post:
      tags: [Users]
      operationId: createPairingCode
      x-directorlink-role: admin
      summary: A pairing code for a user you choose
      description: |
        Since 1.9.0 (ADR-061): a code for pairing at home (`POST /v1/auth/pair`), as Composer's (15
        minutes, works once), whose device joins the user `profile_id`, with their permissions, or a
        new user with `name`, `role` and `access`. The device that pairs never chooses its user. One
        code at a time: it replaces the one shown in Composer, and Composer's New Pairing Code
        replaces it (Composer's still makes a new admin user). The owner's user only by the owner
        (`403 OWNER_PROTECTED`); a user with five devices gets none (`409 USER_DEVICE_LIMIT`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingCodeCreate"
            examples:
              existing:
                value:
                  profile_id: "a1b2c3d4"
              new:
                value:
                  name: Kitchen tablet
                  role: member
                  access:
                    all_rooms: false
                    rooms: [10]
      responses:
        "201":
          description: The code, and who it is for.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingCode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
