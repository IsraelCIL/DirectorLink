  /v1/alarm:
    get:
      tags: [Alarm]
      operationId: getAlarm
      x-directorlink-role: member
      summary: Whether the alarm is armed (read-only)
      description: |
        Each partition of the home's alarm (an area the alarm arms on its own): armed home or away,
        in alarm, open zones, an entry or exit delay, trouble. Read-only: nothing in this API arms or
        disarms, which takes the user's alarm code (ADR-038).

        Off by default: until an installer sets the **Alarm Status** property of DirectorLink in
        Composer to On, the answer is `{"enabled": false, "partitions": []}` and DirectorLink does
        not watch the alarm. While it is on, the partitions are sent only in sealed answers: to
        `POST /v1/sealed` on the home network (the app seals every request) and through remote
        access. A request sent with `Authorization: Bearer` is refused with 403
        `SEALED_REQUEST_REQUIRED`, so whether a home is armed never crosses a network in the clear.
        Nor does the sealed answer's size tell it: the JSON is followed by spaces up to the size it
        would have with every partition at its longest, so that it depends only on the partitions
        there are (their names and rooms), never on their state. For that the panel's words are cut,
        at a character, to 32 bytes (`state`, `armed_type`, `alarm_type`) and 100 (`trouble`), with
        control characters made spaces, and `open_zones` and the delay's seconds stop at 99999.
        A member not given the alarm's status gets 403 `FORBIDDEN` (ADR-054). Partitions the alarm
        does not use are left out. The property
        is read at every request, and `GET /v1/system` says it in `features.alarm_status`.
      responses:
        "200":
          description: The partitions, sorted by name; none while Alarm Status is Off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlarmStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/music:
    get:
      tags: [Music]
      operationId: listMusic
      x-directorlink-role: member
      summary: List the Sonos rooms and what they play
      description: |
        Each Sonos room (a player Sonos shows as a room; a stereo pair or a home theater is one),
        with what its group plays, its own volume and mute, and the Control4 room it is shown in:
        the room of the same name (without regard to case or spaces, or one of the room's names in
        other languages), or the one an admin picked (`PUT /v1/music/{musicId}/room`). Rooms in a
        Sonos group play as one: play, pause and skip go to the group, as Sonos groups them.

        Off by default: until an installer sets the **Sonos** property of DirectorLink in Composer
        to On, the answer is `{"enabled": false, "status": "off", "items": []}` and DirectorLink
        looks for no player. While it is on, it finds the players itself (SSDP, or the player at
        **Sonos Address**, which lists the others) and reads them: the rooms asked for (all of them
        without `room_id`) every few seconds for a while after each request, the others once a
        minute. The answer is what was read last; ask again every few seconds to follow it.

        Since 1.8.0 (ADR-057) `groups` lists the groups as Sonos has them (with `room_id`, those
        with a room there): each led by its coordinator, with its rooms, what it plays and its
        volume. Rooms join and leave groups with `/v1/music/{musicId}/group`.
      parameters:
        - $ref: "#/components/parameters/RoomIdQuery"
      responses:
        "200":
          description: The Sonos rooms, sorted by name; none while Sonos is Off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/music/{musicId}:
