      x-directorlink-role: member
      summary: The caller's profile
      description: |
        The preferences of the person this API key belongs to, shared by all their devices, and
        (since 1.8.0) what they may do (`access`). `503 UNAVAILABLE` (1.8.0) while the profiles
        could not be read when DirectorLink started.
      responses:
