  /v1/relays/{relayId}:
    parameters:
      - $ref: "#/components/parameters/RelayId"
    get:
      tags: [Relays]
      operationId: getRelay
      x-directorlink-role: member
      summary: Get a relay
      responses:
        "200":
          description: The relay and its last reported state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relay"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Relays]
      operationId: updateRelay
      x-directorlink-role: member
      summary: Open or close a relay and leave it so
      description: |
        For a door or gate use `POST …/pulse` instead; this holds the relay in the new state.
        `{"state": "open"}` releases the relay. `{"state": "closed"}` holds it closed, which holds a
        door or gate open until the relay is opened. Since 1.1.1 that is refused with 409
        `HOLD_NOT_ALLOWED`, and nothing is sent, unless the **Relay Hold** property of DirectorLink
        in Composer is set to Allowed (the default is Not allowed). Like a pulse, only for those who
        open doors and gates (admins, members given them: else 403 `FORBIDDEN`, ADR-054). A Relay
        Door, Gate or Garage Door Controller's door (1.10.0, ADR-069) has no relay of DirectorLink's
        to hold or release: 409 `NOT_SUPPORTED`, nothing sent (one shown as a KNX relay holds and
        releases that relay, as before).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelayUpdate"
            example:
              state: open
      responses:
        "202":
          description: Command sent. The body is the last state the controller reported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relay"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/CommandFailed"

  /v1/relays/{relayId}/pulse:
    parameters:
      - $ref: "#/components/parameters/RelayId"
    post:
      tags: [Relays]
      operationId: pulseRelay
      x-directorlink-role: member
      summary: Pulse the relay (open a door or gate)
      description: |
        Closes the relay and opens it again after 500 ms, the way Control4's Relay Door, Gate and
        Garage Door Controllers trigger it. A controller's door (`kind` door, gate or garage_door,
        1.10.0, ADR-069) is sent the controller's own Open, once: one pulse of its Open relay for its
        own pulse time, with its own settings (one relay: the gate's button, not sent while a
        contact says it is open). A controller set to hold its relay (Relay Configuration Hold, where
        Director gives that property) would hold the door open: 409 `HOLD_NOT_ALLOWED` unless Relay
        Hold is Allowed, and never in a scene. Every pulse is written to the log with the API key used.
        For admins and the members given doors and gates (ADR-054); a member who sees the relay but
        may not open it gets 403 `FORBIDDEN`. Needs **Door Control** = Enabled in Composer.

        Since 1.8.0 (ADR-058) the body may carry `request`, the id of an open request an
        ask-to-open link made: the pulse then answers it, with the same checks as any opening, and
        only from a device the request was sent to, within its two minutes (409
        `OPEN_REQUEST_EXPIRED` otherwise, and nothing opens), once (409 `OPEN_REQUEST_ANSWERED`).
        History names the link with the opening. Any other body is ignored, as before.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelayPulse"
      responses:
        "202":
          description: Pulse started. The body is the last state the controller reported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relay"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/CommandFailed"

