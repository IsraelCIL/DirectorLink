  /v1/thermostats:
    get:
      tags: [Thermostats]
      operationId: listThermostats
      x-directorlink-role: member
      summary: List thermostats
      parameters:
        - $ref: "#/components/parameters/RoomIdQuery"
      responses:
        "200":
          description: Thermostats with their current state, sorted by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThermostatList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
