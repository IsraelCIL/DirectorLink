openapi: 3.1.0
info:
  title: DirectorLink API
  # Stamped from the repository VERSION file at build time.
  version: 0.0.0
  summary: Local REST API for a Control4 home.
  description: |
    **Direct to Director. End-to-end integration. Open source.**

    DirectorLink runs as a driver inside the Control4 controller (Director) and serves this API on
    the home LAN. Resources use logical names — rooms, devices, lights, thermostats, fans, blinds, cameras, relays, doorbells, refrigerators, the alarm, music (Sonos), scenes, schedules, the weather, the calendar, profiles, invitations. Control4
    command names, proxy IDs and variable numbers never appear in the API.

    **Authentication.** Every operation except health, this API description, pairing and
    `/v1/sealed` (sealed requests, below) needs an API key: `Authorization: Bearer <api key>`. The first key comes from a pairing code: in
    Composer, the **New Pairing Code** action on DirectorLink shows an 8-digit code (`1234 5678`)
    that is valid for 15 minutes and works once (`POST /v1/auth/pair`). An admin key then creates
    more keys under `/v1/api-keys`.

    **Admins and members (since 1.8.0, ADR-054).** Every API key belongs to a person (a profile), and
    has that person's permissions. A person is an `admin` or a `member`. Admins do everything: they
    manage people and their keys, invitations, rooms (and the room of a Sonos room), scenes,
    schedules, the calendar's settings, backups, remote access, the history and the log. For each
    member an admin chooses the rooms they see (all, or a list; never a room hidden from members),
    the kinds of devices they use there (lights, climate, fans, blinds, music, refrigerators, each on
    or off), whether they see cameras, open doors and gates, and see the alarm's status, and the
    scenes they may run (`/v1/profiles/{profileId}/access`). Operations with `x-directorlink-role:
    admin` are for admins (`403 FORBIDDEN` otherwise); on `member` operations every person may ask,
    and the answer holds what they may see: a device, room or scene a member may not see answers
    `404` as one that does not exist does, and lists leave it out. A door or gate a member sees but
    may not open answers `403 FORBIDDEN`. Opening doors also needs the **Door Control** property of
    DirectorLink in Composer set to Enabled. `GET /v1/api-keys/current` says what the caller may do
    (`access`). A key keeps `role`, the role DirectorLink 1.7.0 had (`viewer`, `member`, `doors`,
    `admin`), worked out from its person; requests that set a 1.7.0 role set the person's role and
    permissions as that role became in 1.8.0.

    **Changing state.** Send a device's desired state with `PATCH`. The bridge answers
    `202 Accepted` once the command has been handed to the controller. The returned object holds the last state the
    controller reported, so read the resource again to confirm the change.

    **Addresses and browsers.** Requests must be sent to the controller's IP address or a local name
    (e.g. `director.local`); any other `Host` is refused with `421 MISDIRECTED_REQUEST` (this stops
    DNS rebinding). Browsers may call the API only from DirectorLink's own sites.

    **Sealed requests.** The DirectorLink app does not send its key on the home network: it seals
    each request with its device's lock key and sends it to `POST /v1/sealed`, and pairs with CPace,
    so neither the pairing code nor the new key crosses the network (docs/ACCOUNTS.md). Scripts may
    keep using `Authorization: Bearer`, and pair by sending the code.

    **Errors.** All errors use RFC 9457 Problem Details (`application/problem+json`) with a stable,
    machine-readable `code`.

    **Conventions.** JSON properties are snake_case, times are ISO 8601 in UTC, temperatures are
    degrees Celsius, and IDs are the numeric IDs of the Control4 project (treat them as opaque).
    Since 1.10.2 a thermostat says its scale (`scale`) and one in Fahrenheit also gives its values in
    °F (`*_f`), as Control4 reports them; `temperature_scale` in `GET /v1/system` is the project's,
    for what no one thermostat says (the weather, weather schedules).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://{host}:41999
    description: DirectorLink on the Control4 controller (LAN only).
    variables:
      host:
        default: 192.168.1.10
        description: IP address or local hostname of the Control4 controller.
security:
  - apiKey: []
tags:
  - name: System
    description: Bridge status and controller information.
  - name: Auth
    description: Pairing and API keys.
  - name: Profiles
    description: Each user's preferences (language, theme, palette, favorites), shared by their devices, and (since 1.8.0) their role and permissions. Every API key belongs to one profile; a profile is a user (1.9.0, ADR-061).
  - name: Users
    description: "Users and their devices (1.9.0, ADR-061: Settings → Users), up to five devices a user, the devices of one account brought into one user, and pairing at home for a chosen user."
  - name: Rooms
    description: Rooms of the Control4 project.
  - name: Schedules
    description: "Scenes run by the controller at a time, at sunrise or sunset, when the weather turns (Open-Meteo: heat, wind, rain), or when Shabbat and holidays begin or end."
  - name: Calendar
    description: "Shabbat and holiday times, the Hebrew date and the weekly reading, worked out on the controller (Composer: Jewish Calendar)."
  - name: Scenes
    description: "The home's scenes: one tap sets several lights, thermostats, fans, blinds and gates. Admins make them, members run them."
  - name: Devices
    description: Every device in the project, including ones DirectorLink cannot control yet.
  - name: Lights
    description: Lights DirectorLink can read and control.
  - name: Thermostats
    description: Heating and cooling zones DirectorLink can read and control.
  - name: Fans
    description: |
      Fans DirectorLink can read and control, on and off and at four speeds (since 1.2.0). Every fan
      is taken to have four: the fan proxy allows other numbers, set up in the fan's driver, and a fan
      with three shows its top speed as 3 and is sent 4 for high, one with five or more shows the
      speeds above 4 as on without a speed.
  - name: Blinds
    description: Blinds, shades and shutters DirectorLink can read and control.
  - name: Cameras
    description: Camera snapshots, fetched on the controller so camera logins never leave it.
  - name: Relays
    description: Doors and gates DirectorLink opens with a short press, a pulse. KNX Contact/Relay devices, and since 1.10.0 Control4's Relay Door, Gate and Garage Door Controllers, whatever relay they drive (ADR-069); `kind` says which.
  - name: Doorbells
    description: Video doorbells — rings, motion, access, and opening the gate or door wired to them. A DoorBird, and since 1.10.0 a camera whose driver follows DirectorLink's camera agreement and says it is a doorbell (ADR-065, docs/CAMERA_DRIVERS.md); such a doorbell has the camera's id, its picture is that camera's, and it rings.
  - name: Refrigerators
    description: |
      Samsung refrigerators (since 1.7.0, ADR-049), through the Samsung Refrigerator (DirectorLink)
      driver, which talks to Samsung's SmartThings cloud: fridge and freezer temperatures, the door,
      the water filter, and Power Cool, Power Freeze, Sabbath Mode and the ice maker switched on and
      off. A command reaches the refrigerator through Samsung's cloud; its new state shows once the
      refrigerator confirms it, typically after about 4 seconds (the driver gives up after about a
      minute). Doors and temperatures are read at the driver's poll interval (2 minutes by default).
  - name: Alarm
    description: |
      Whether the home's alarm is armed, read-only (ADR-038). Off until an installer turns on
      **Alarm Status** in Composer; then for admins and the members given it, in sealed requests only. Nothing
      in this API arms or disarms.
  - name: Music
    description: |
      Sonos rooms on the home network (ADR-044, docs/SONOS.md): what each plays, its volume and
      mute, play, pause, skip and the Sonos favorites. Off until an installer sets the **Sonos**
      property of DirectorLink in Composer to On. DirectorLink talks to the players itself, with the
      local protocol the Sonos app uses (UPnP/SOAP on port 1400), which Sonos does not document.
  - name: Backup
    description: |
      Everything DirectorLink keeps on the controller, to download and restore (ADR-042,
      docs/BACKUP.md). For admins, in sealed requests only: a backup holds every key's hash and lock
      key and the home's remote identity. The app encrypts it with a password before saving it.
  - name: Activity
    description: |
      What the controller did and noticed (ADR-046, docs/HISTORY.md): scenes and schedules run or
      skipped and why, doors and gates opened, keys and invitations, changes made in Composer,
      backups, restores and driver updates. Kept on the controller (the newest 500 entries, 30 days
      at most); through the account only sealed, like every request. For admins.
  - name: Alerts
    description: |
      Which alerts each device gets (1.7.0, ADR-050): a doorbell rang, a door or gate was opened, the
      refrigerator's door was left open, a schedule failed; since 1.8.0 a camera of the DirectorLink ·
      Hikvision drivers saw someone or something (ADR-056), since 1.10.0 a camera of any driver of
      DirectorLink's camera agreement (ADR-065). The controller sends them through
      DirectorLink's servers sealed to each device's own key, so the servers learn only which key
      ids an alert is for and when (docs/RELAY.md, `notify`). Each key reads and sets its own choices.
  - name: Logs
    description: The bridge's own recent log, for debugging.
  - name: Remote
    description: |
      Remote access with accounts (docs/ACCOUNTS.md): claiming this home for an account, and
      invitations. Requests that arrive through remote access are sealed end to end and run as the
      device's own key and role.

paths:
  /v1/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Check that the bridge is running
      description: Needs no key, so a client can also use it to find DirectorLink on the home network.
      security: []
      responses:
        "200":
          description: The bridge is reachable. `status` tells whether project discovery finished.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /v1/openapi.json:
    get:
      tags: [System]
      operationId: getApiDescription
      summary: Get this API description
      security: []
      responses:
        "200":
          description: The OpenAPI 3.1 document for the running bridge version.
          content:
            application/json:
              schema:
                type: object
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/system:
    get:
      tags: [System]
      operationId: getSystem
      x-directorlink-role: member
      summary: Get bridge, controller and project information
      responses:
        "200":
          description: Bridge, controller, location and inventory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/pair:
    post:
      tags: [Auth]
      operationId: pair
      summary: Exchange a pairing code for an admin API key
      description: |
        Codes are created on demand with the Composer action **New Pairing Code** on DirectorLink
        (and automatically while the driver has no API keys, e.g. right after it is added), and since
        1.9.0 by an admin in the app (`POST /v1/pairing-code`) for a user they choose (ADR-061).
        Composer shows the code as `1234 5678`; send it with or without the space. A code is valid for
        15 minutes and works once; without an active code the answer is `PAIRING_NOT_ACTIVE`.
        Five wrong codes within a minute lock pairing for that device (IP address) for 60 seconds;
        twenty wrong codes in all close the code. Pairing works only on the home network, never as
        a sealed request (`PAIRING_ONLY_ON_HOME_NETWORK`). Composer's code gives a new admin user:
        running Composer actions already means full control of the project. A code made in the app
        gives the user it was made for, with their permissions, or the new user it was made for; the
        device never chooses. Such a code works only while its user is there and its maker is an
        admin who may add a device to them (else `403 PAIRING_NOT_ACTIVE`, and the code closes), and
        while the user has fewer than five devices (`409 USER_DEVICE_LIMIT`, before anything counts
        against the code). With `expires_in` (seconds,
        60 to 2592000) the key stops working that long after (`expires_at`); the API console asks
        for a day for its own key.

        **Without sending the code (CPace, since 1.3.0; the app and the console pair this way).**
        CPace (draft-irtf-cfrg-cpace, CPACE-X25519-SHA512) in two requests; the controller is the
        initiator A, the client B. (1) `{ name, expires_in?, cpace: { nonce } }` answers `200` with
        `cpace: { session, nonce, share }`. (2) `{ cpace: { session, share, confirm } }` answers
        `201` with `cpace: { confirm }` and the new key `sealed`. The password (PRS) is the 8
        digits; `sid` is the client's nonce, then the controller's (16 bytes each); `CI` is
        `lv_cat("DirectorLink pair v2", name, expires_in)` (each as sent, `""` when absent;
        expires_in in decimal); ADa and ADb are empty; the transcript is initiator-responder. The
        tags are the draft's key confirmation: `mac_key = SHA-512("CPaceMac" || sid || ISK)`, the
        client's `confirm` is HMAC-SHA512(mac_key, lv_cat(Yb, "")), the controller's
        HMAC-SHA512(mac_key, lv_cat(Ya, "")). The key is made only after the client's tag is
        right, and is sealed (the Envelope format, home and key `pair`, direction `res`) with the
        lock key HMAC-SHA256(ISK, "DirectorLink pair v2"). An attempt counts as a wrong code from
        its first request until it succeeds (the limits above); a wrong tag answers
        `PAIRING_CODE_INVALID`. An exchange works once, from the device that started it, for 60
        seconds (`PAIRING_SESSION_EXPIRED`); one begun before a new code was made answers
        `PAIRING_CODE_EXPIRED`. A share of low order is refused (`INVALID_FIELD`, `cpace.share`).
        DirectorLink before 1.3.0 refuses the field `cpace` (`INVALID_FIELD`); a controller whose
        lock failed its self-test answers `503` `LOCK_UNAVAILABLE`.

        **With the code** (scripts; the app only after warning that it travels unprotected): the
        key comes back as it is. With `exchange` (the app's X25519 public key), the answer is
        sealed: it holds the driver's public key and the new key sealed with a lock key derived
        from the shared secret, the code and both public keys.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairRequest"
            example:
              pairing_code: "1234 5678"
              name: Chrome on my laptop
      responses:
        "200":
          description: "CPace, first request: the controller's share. Nothing is paired yet."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CpaceStarted"
        "201":
          description: Paired. The response holds the new API key, shown only once, or the key sealed for this exchange (with `exchange`, or CPace's second request).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/NewApiKey"
                  - $ref: "#/components/schemas/SealedPairing"
                  - $ref: "#/components/schemas/CpacePaired"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: The pairing code is wrong, or CPace's tag is (`PAIRING_CODE_INVALID`, with `attempts_remaining`), no code is active — it expired, was used, was closed after too many wrong codes, or none was created (`PAIRING_NOT_ACTIVE`) — a new code was made during a CPace exchange (`PAIRING_CODE_EXPIRED`), or the request was sealed (`PAIRING_ONLY_ON_HOME_NETWORK`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The controller has as many keys as it holds (`KEY_LIMIT_REACHED`), or the CPace exchange is not open, any more or from this device (`PAIRING_SESSION_EXPIRED`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/sealed:
    get:
      tags: [Auth]
      operationId: sealedInfo
      summary: What a sealed request needs from this controller
      description: The controller's clock, for sealing requests on the home network.
      security: []
      responses:
        "200":
          description: The time, and what envelopes name as their home.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SealedInfo"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [Auth]
      operationId: sealedRequest
      summary: Send a sealed request on the home network
      description: |
        The request inside the envelope ({ id, ts, method, path, body }) is sealed with the device's
        lock key, derived from its API key; it runs with that key's role, and the answer comes back
        sealed the same way. Each envelope works once, within two minutes of the controller's clock.
        Refused envelopes get a problem with `code` (`UNKNOWN_KEY`, `BAD_MAC`, `BAD_ENVELOPE`,
        `STALE`, `REPLAYED`, `LOCK_UNAVAILABLE`) and the controller's `time`; nothing ran. Envelopes
        name the home `lan`. Only straight from the home network: a sealed request cannot carry
        another one (`BAD_REQUEST`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SealedRequest"
      responses:
        "200":
          description: The answer, sealed (its `status` may be any HTTP status).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SealedAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/api-keys:
    get:
      tags: [Auth]
      operationId: listApiKeys
      x-directorlink-role: admin
      summary: List API keys
      responses:
        "200":
          description: All API keys. Secrets are never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Auth]
      operationId: createApiKey
      x-directorlink-role: admin
      summary: Create an API key
      description: |
        A key for a new person, an admin or a member with `access` (since 1.8.0), or with
        `profile_id` another device of a person, which has that person's permissions. The roles of
        DirectorLink 1.7.0 still work: `viewer`, `member` without `access` and `doors` make the person
        that role became in 1.8.0 (ADR-054). Only the home's owner adds a key to the owner's person
        (`403 OWNER_PROTECTED`). `503 UNAVAILABLE` while DirectorLink could not read who the owner
        is (for a key added to an admin's person) or the people's profiles or permissions (for a new
        person) when it started.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyCreate"
            example:
              name: Home Assistant
      responses:
        "201":
          description: Created. The response holds the new API key — it is shown only once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewApiKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/api-keys/current:
    get:
      tags: [Auth]
      operationId: getCurrentApiKey
      x-directorlink-role: member
      summary: The API key used for this request
      description: |
        Lets an app learn what its person may do (`access`, since 1.8.0) to show only that. The
        secret is not returned.
      responses:
        "200":
          description: This key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Auth]
      operationId: revokeCurrentApiKey
      x-directorlink-role: member
      summary: Revoke the API key used for this request
      description: Lets any client forget itself, whatever its role; later requests with the key get 401.
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/api-keys/{keyId}:
    parameters:
      - $ref: "#/components/parameters/KeyId"
    patch:
      tags: [Auth]
      operationId: updateApiKey
      x-directorlink-role: admin
      summary: Rename an API key, move it to another person, or set a 1.7.0 role
      description: |
        A key has its person's permissions (ADR-054): `profile_id` moves it to another person, and
        it then has theirs. `role`, as DirectorLink 1.7.0 clients send it, changes the key's person
        (all of their devices) into what that role became in 1.8.0, unless the key has that role
        already. The home's owner's devices are only theirs to move, and only they move a device to
        the owner (`403 OWNER_PROTECTED`), the owner stays an admin (`409 OWNER_STAYS_ADMIN`), and
        there is always an admin (`409 LAST_ADMIN`). A moved key's 1.7.0 `role` becomes its new
        person's at once. `500` when the keys could not be saved: nothing changed. `503 UNAVAILABLE`
        for an admin's device while DirectorLink could not read who the owner is when it started. Use
        `PATCH /v1/profiles/{profileId}/access` to set a person's role and permissions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyUpdate"
            example:
              role: member
      responses:
        "200":
          description: The changed key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [Auth]
      operationId: deleteApiKey
      x-directorlink-role: member
      summary: Revoke an API key (remove a device)
      description: |
        Revoking the key used for this request is allowed; later requests with it get 401. An admin
        revokes any key but the home's owner's devices, which are only the owner's (or Composer's
        Revoke All API Keys) to revoke (`403 OWNER_PROTECTED`); an admin's device waits
        (`503 UNAVAILABLE`) while DirectorLink could not read who the owner is when it started. Since
        1.9.0 (ADR-061) a member revokes the other devices of their own user; any other key is, for
        them, one that does not exist (`404`). A user goes with their last device.
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/remote:
    get:
      tags: [Remote]
      operationId: getRemoteAccess
      x-directorlink-role: member
      summary: Remote access status
      description: |
        Whether Remote Access is switched on in Composer, connected, and able to seal requests, and
        this home's id while it is on. Since 1.8.0 (ADR-059) also `update_required`: the account
        service no longer takes this version of DirectorLink, so remote access stays down until it is
        updated in Composer (the app says "Update DirectorLink" on the home network too).
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteAccess"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/remote/claim:
    post:
      tags: [Remote]
      operationId: createClaimToken
      x-directorlink-role: admin
      summary: A claim token for linking this home to an account
      description: |
        The app gives the token to the DirectorLink cloud, which checks it with this controller
        over remote access. It works once, for 5 minutes. Only from the home network: holding an
        admin key here is what proves the home is yours. Whoever claims it is the home's owner
        (ADR-054); once a person has claimed it with DirectorLink 1.8.0, only they claim it again
        (403 `OWNER_ONLY`), so that no other admin can take it from them; and nobody while
        DirectorLink could not read who the owner is when it started (503 `UNAVAILABLE`).
      responses:
        "201":
          description: A new token (it replaces any earlier one).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/remote/secret:
    post:
      tags: [Remote]
      operationId: prepareHomeSecret
      x-directorlink-role: admin
      summary: A new secret for the home's relay connection, for the owner to approve
      description: |
        The controller makes a new secret for its connection to the relay and keeps it next to the
        one in use; the answer holds only its SHA-256. The home's owner gives that to the account
        service (`POST /v1/homes/{home_id}/secret` on api.directorlink.io), which from then on
        accepts only the new secret, and the controller connects with it (docs/RELAY.md). Each
        request gets a new secret; the newest three wait for a day. Only from the home network
        (`SECRET_ONLY_ON_HOME_NETWORK`), so that whoever holds a copy of this controller's data
        cannot replace it.
      responses:
        "200":
          description: The waiting secret's SHA-256.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewHomeSecret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/invitations:
    get:
      tags: [Remote]
      operationId: listInvitations
      x-directorlink-role: admin
      summary: Pending invitations
      description: Invitations that have not been accepted and have not expired, without their secrets.
      responses:
        "200":
          description: The pending invitations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Remote]
      operationId: createInvitation
      x-directorlink-role: member
      summary: Invite someone, or another device of your own
      description: |
        The answer holds the invitation's secret, once. The app puts it after `#` in the link it
        shares, so it never reaches a server; the controller keeps only a key derived from it.
        Whoever accepts gets their own API key, as a new person with this role and, for a member,
        the permissions in `access` (since 1.8.0, ADR-054); `for_me` keys join the admin's own
        person, and only while that admin may add a device to it (the owner's person only by the
        owner, ADR-054; else the join is refused as `INVITATION_NOT_FOUND`, and `503 UNAVAILABLE`
        here while DirectorLink could not read who the owner is when it started). The roles of DirectorLink 1.7.0 still work (`viewer`, `member` without `access`,
        `doors`): the person is then what that role became in 1.8.0. Needs Remote Access switched on.
        Since 1.9.0 (ADR-061) every user, admin or member, invites their own other device
        (`for_me`, Add my other device, also when a device of their account asks to join), into their
        own user with their permissions; inviting anyone else stays the admins' (`403 FORBIDDEN`).
        A member's lasts at most 10 minutes (`expires_in` up to 600, the default), their user keeps
        at most two waiting (a new one replaces the oldest), and with `email` it is registered only
        for an account that already uses the member's device at the home, which the account service
        checks: `403 ACCOUNT_NOT_OF_DEVICE` for another email, `502 FOR_KEY_UNSUPPORTED` from an
        account service that cannot check it.
        An admin may invite another device of an existing user (`profile_id`), such as the Google or
        Apple account of a user paired at home. A user has at most five devices: `409
        USER_DEVICE_LIMIT` here, and the join is refused with that code while they still have five
        (the invitation stays). An invitation into a user who is gone is refused as
        `INVITATION_NOT_FOUND`.
        With `email`, the controller registers the invitation with the account service first; if
        that fails (`REMOTE_OFFLINE`, or the service's own code with 502) the invitation is
        revoked, since its link could not work.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreate"
      responses:
        "201":
          description: The invitation, with its secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewInvitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/CommandFailed"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/InvitationId"
    delete:
      tags: [Remote]
      operationId: revokeInvitation
      x-directorlink-role: member
      summary: Revoke a pending invitation
      description: |
        Admins revoke any invitation; since 1.9.0 (ADR-061) anyone else those made by a device of
        their own user (`404` for any other).
      responses:
        "204":
          description: Revoked; the link no longer works.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/profile:
    get:
      tags: [Profiles]
