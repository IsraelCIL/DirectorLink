          pattern: "^[0-9a-f]{8}$"
    delete:
      tags: [Relays]
      operationId: deleteAskLink
      x-directorlink-role: member
      summary: Remove an ask-to-open link
      description: Since 1.8.0 (ADR-058). The link stops working at once. A key removes its person's links; an admin anyone's (another person's is 404 for others).
      responses:
        "204":
          description: Removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/off:
    post:
      tags: [Scenes]
      operationId: turnOff
      x-directorlink-role: member
      summary: Turn off lights or AC, or close blinds
      description: |
        Since 1.3.0. Turns off the lights, or the thermostats (mode `off`, like a scene's "All AC:
        Off"), or closes the blinds (position 0) that it names, in one request: the app's "Turn off
        all" on Home, which names the ones it shows on or open. Answers like running a scene: a
        device the controller refused is `failed`, a thermostat without an Off mode is `skipped`
        (`MODE_NOT_SUPPORTED`), and the rest still run. It never turns anything on, and doors and
        gates are not among its types. A member names only devices they may control (ADR-054): any
        other is refused like one that does not exist (400).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TurnOff"
            example:
              type: lights
              device_ids: [20, 22]
      responses:
        "202":
          description: The commands were handed to the controller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/schedules:
    get:
      tags: [Schedules]
      operationId: listSchedules
      x-directorlink-role: admin
      summary: List schedules
      description: Admins only since 1.8.0 (ADR-054); members never see schedules.
      responses:
        "200":
          description: The home's schedules, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Schedules]
      operationId: createSchedule
      x-directorlink-role: admin
      summary: Create a schedule
      description: |
        Runs a scene at a time of day, at sunrise or sunset (with an offset), or when the weather
        turns — a temperature or hotter, a wind speed or more, or rain starting — on the chosen
        days (0 Sunday to 6 Saturday), in the controller's local time. At most 50. A scheduled
        scene runs like one from a member's key: doors and gates in it are skipped.

        With the Jewish calendar on (`/v1/calendar`), a `shabbat` trigger runs it when Shabbat and
        holidays begin (candle lighting) or end (havdalah), and `during_shabbat` makes other
        schedules skip holy time or run only then. Setting either while the calendar is off is
        `409 JEWISH_CALENDAR_OFF`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleCreate"
            example:
              scene_id: 0a1b2c3d
              trigger: { type: time, at: "06:45" }
              days: [0, 1, 2, 3, 4]
              only_if: { not_raining: true }
              if_no_weather: run
      responses:
        "201":
          description: The new schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/schedules/{scheduleId}:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    get:
      tags: [Schedules]
      operationId: getSchedule
      x-directorlink-role: admin
      summary: Get a schedule
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Schedules]
      operationId: updateSchedule
      x-directorlink-role: admin
      summary: Change a schedule
      description: |
        The fields sent replace the schedule's (a whole `trigger` or `only_if`); `{"enabled": false}`
        switches it off. With `version`, the change applies only if nobody changed the schedule
        since (409 `VERSION_CONFLICT`). A changed weather schedule may run again. While the Jewish
        calendar is off, sending a `shabbat` trigger or `during_shabbat` other than `run` is 409
        `JEWISH_CALENDAR_OFF`; a schedule that has one can still be switched on or off, change its
        days or scene, or be deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleUpdate"
      responses:
        "200":
          description: The schedule after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [Schedules]
      operationId: deleteSchedule
      x-directorlink-role: admin
      summary: Delete a schedule
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/weather:
    get:
      tags: [Schedules]
      operationId: getWeather
      x-directorlink-role: member
      summary: The weather at home
      description: |
        The weather now and today's forecast for the project's location (Composer project
        properties), and today's sunrise and sunset, worked out on the controller. Since 1.10.0
        (ADR-071) the weather now is the hour for now of Open-Meteo's hourly forecast, which the
        controller reads every 6 hours while a schedule needs the weather, and for an hour after this
        is asked, and keeps for 5 days: with or without the internet, schedules and this answer use
        the same forecast (`source: forecast`). Up to 1.9.0 it was the current conditions, read every
        15 minutes, and there was no `source`. Weather data by Open-Meteo.com (CC BY 4.0).
      responses:
        "200":
          description: The weather now; `status` says why there is none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Weather"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/calendar:
    get:
      tags: [Calendar]
      operationId: getCalendar
      x-directorlink-role: member
      summary: Shabbat and holiday times, the Hebrew date and the week's reading
      description: |
        Worked out on the controller from the project's location (Composer project properties);
        nothing is sent to the network. It needs DirectorLink's **Jewish Calendar** property in
        Composer set to On. While it is Off (the default) the answer is `enabled: false`,
        `status: off` and nulls, and schedules cannot use the calendar.

        Candle lighting is sunset (to the minute) minus `candle_lighting_minutes`; havdalah is
        sunset (to the nearest minute) plus `havdalah_minutes`. Shabbat and holidays that follow
        each other are one holy period, from the candle lighting before the first day to the
        havdalah after the last. `status: no_location` still gives the settings, the civil date's
        Hebrew date and the week's reading, but no times. Check the times against your community's
        calendar.
      responses:
        "200":
          description: The calendar; `status` says why parts of it are null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calendar"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/calendar/settings:
    patch:
      tags: [Calendar]
      operationId: updateCalendarSettings
      x-directorlink-role: admin
      summary: Change the candle-lighting and havdalah minutes, or Israel or abroad
      description: |
        The fields sent replace the settings, which are kept on the controller; send at least one
        besides `version`. With `version`, the change applies only if nobody changed the settings
        since (409 `VERSION_CONFLICT`, with the current `version`). While the Jewish Calendar
        property is Off the answer is 409 `JEWISH_CALENDAR_OFF`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarSettingsUpdate"
            example:
              candle_lighting_minutes: 30
              havdalah_minutes: 50
              version: 1
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"

