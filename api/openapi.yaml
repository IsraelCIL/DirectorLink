      operationId: listSceneLinks
      x-directorlink-role: admin
      summary: List the scene links
      description: |
        Since 1.7.0 (ADR-051). Every scene that has a link for the phone's own automations, with
        its scene's name, its label, when it was made and when it last ran; never a secret. Also
        what a link needs to work: `remote_access` (the Composer property) and `home_linked` (the
        account service has accepted this home). Links whose scene is gone or now opens doors or
        gates, that were made for another home connection, or whose key (`made_by`) was revoked or
        expired, go before the list is made.
      responses:
        "200":
          description: The links.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneLinkList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/scenes/{sceneId}/link:
    parameters:
      - $ref: "#/components/parameters/SceneId"
    get:
      tags: [Scenes]
      operationId: getSceneLink
      x-directorlink-role: admin
      summary: Get a scene's link
      description: Since 1.7.0 (ADR-051). The scene's link, without its secret; 404 when it has none.
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneLink"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Scenes]
      operationId: createSceneLink
      x-directorlink-role: admin
      summary: Make a scene's link
      description: |
        Since 1.7.0 (ADR-051). A new private link for the scene, for the phone's own automations
        (iPhone Shortcuts, Android automation apps, an NFC tag). It replaces the scene's link, which
        stops working at once. The answer is the only place its `secret` ever appears: the controller
        keeps a hash of it, as of API keys. A phone runs the scene with a POST to `url` without what
        follows `#`, with the secret in the body (docs/SCENES.md); the account service passes it to
        the home (`link`, docs/RELAY.md), and the scene runs as a member's key would run it.

        Refused for a scene that opens doors or gates (409 `SCENE_OPENS_DOORS`: a step of a type a
        link may not run; only lights, climate, fans, blinds, music and refrigerators may), while
        Remote Access is off (409 `REMOTE_ACCESS_OFF`), and before the account service has accepted
        the home (409 `HOME_NOT_LINKED`). A scene changed to open doors or gates loses its link. The
        link goes with the key that makes it (`made_by`): revoking that key, or its expiry, removes
        it.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneLinkCreate"
            example:
              label: Arriving home
      responses:
        "201":
          description: The new link, with its secret, shown this once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneLinkCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [Scenes]
      operationId: deleteSceneLink
      x-directorlink-role: admin
      summary: Remove a scene's link
      description: Since 1.7.0 (ADR-051). The link stops working at once. The Composer action Remove All Scene Links removes every one.
      responses:
        "204":
          description: Removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/off:
    post:
      tags: [Scenes]
      operationId: turnOff
      x-directorlink-role: member
      summary: Turn off lights or AC, or close blinds
      description: |
        Since 1.3.0. Turns off the lights, or the thermostats (mode `off`, like a scene's "All AC:
        Off"), or closes the blinds (position 0) that it names, in one request: the app's "Turn off
        all" on Home, which names the ones it shows on or open. Answers like running a scene: a
        device the controller refused is `failed`, a thermostat without an Off mode is `skipped`
        (`MODE_NOT_SUPPORTED`), and the rest still run. It never turns anything on, and doors and
        gates are not among its types.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TurnOff"
            example:
              type: lights
              device_ids: [20, 22]
      responses:
        "202":
          description: The commands were handed to the controller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/schedules:
    get:
      tags: [Schedules]
      operationId: listSchedules
      x-directorlink-role: viewer
      summary: List schedules
      responses:
        "200":
          description: The home's schedules, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Schedules]
      operationId: createSchedule
      x-directorlink-role: admin
      summary: Create a schedule
      description: |
        Runs a scene at a time of day, at sunrise or sunset (with an offset), or when the weather
        turns — hotter than a threshold, wind stronger than one, or rain starting — on the chosen
        days (0 Sunday to 6 Saturday), in the controller's local time. At most 50. A scheduled
        scene runs like one from a member's key: doors and gates in it are skipped.

        With the Jewish calendar on (`/v1/calendar`), a `shabbat` trigger runs it when Shabbat and
        holidays begin (candle lighting) or end (havdalah), and `during_shabbat` makes other
        schedules skip holy time or run only then. Setting either while the calendar is off is
        `409 JEWISH_CALENDAR_OFF`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleCreate"
            example:
              scene_id: 0a1b2c3d
              trigger: { type: time, at: "06:45" }
              days: [0, 1, 2, 3, 4]
              only_if: { not_raining: true }
              if_no_weather: run
      responses:
        "201":
          description: The new schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/schedules/{scheduleId}:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    get:
      tags: [Schedules]
      operationId: getSchedule
      x-directorlink-role: viewer
      summary: Get a schedule
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Schedules]
      operationId: updateSchedule
      x-directorlink-role: admin
      summary: Change a schedule
      description: |
        The fields sent replace the schedule's (a whole `trigger` or `only_if`); `{"enabled": false}`
        switches it off. With `version`, the change applies only if nobody changed the schedule
        since (409 `VERSION_CONFLICT`). A changed weather schedule may run again. While the Jewish
        calendar is off, sending a `shabbat` trigger or `during_shabbat` other than `run` is 409
        `JEWISH_CALENDAR_OFF`; a schedule that has one can still be switched on or off, change its
        days or scene, or be deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleUpdate"
      responses:
        "200":
          description: The schedule after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [Schedules]
      operationId: deleteSchedule
      x-directorlink-role: admin
      summary: Delete a schedule
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/weather:
    get:
      tags: [Schedules]
      operationId: getWeather
      x-directorlink-role: viewer
      summary: The weather at home
      description: |
        Open-Meteo's current conditions and today's forecast for the project's location (Composer
        project properties), as the controller last read them, and today's sunrise and sunset,
        worked out on the controller. The controller reads the weather every 15 minutes while a
        schedule needs it, and for an hour after this is asked. Weather data by Open-Meteo.com
        (CC BY 4.0).
      responses:
        "200":
          description: The latest reading; `status` says why there is none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Weather"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/calendar:
    get:
      tags: [Calendar]
      operationId: getCalendar
      x-directorlink-role: viewer
      summary: Shabbat and holiday times, the Hebrew date and the week's reading
      description: |
        Worked out on the controller from the project's location (Composer project properties);
        nothing is sent to the network. It needs DirectorLink's **Jewish Calendar** property in
        Composer set to On. While it is Off (the default) the answer is `enabled: false`,
        `status: off` and nulls, and schedules cannot use the calendar.

        Candle lighting is sunset (to the minute) minus `candle_lighting_minutes`; havdalah is
        sunset (to the nearest minute) plus `havdalah_minutes`. Shabbat and holidays that follow
        each other are one holy period, from the candle lighting before the first day to the
        havdalah after the last. `status: no_location` still gives the settings, the civil date's
        Hebrew date and the week's reading, but no times. Check the times against your community's
        calendar.
      responses:
        "200":
          description: The calendar; `status` says why parts of it are null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calendar"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/calendar/settings:
    patch:
      tags: [Calendar]
      operationId: updateCalendarSettings
      x-directorlink-role: admin
      summary: Change the candle-lighting and havdalah minutes, or Israel or abroad
      description: |
        The fields sent replace the settings, which are kept on the controller; send at least one
        besides `version`. With `version`, the change applies only if nobody changed the settings
        since (409 `VERSION_CONFLICT`, with the current `version`). While the Jewish Calendar
        property is Off the answer is 409 `JEWISH_CALENDAR_OFF`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarSettingsUpdate"
            example:
              candle_lighting_minutes: 30
              havdalah_minutes: 50
              version: 1
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"

