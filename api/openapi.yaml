      description: |
        This room's own speaker, in a group too (the other rooms keep theirs). Answered once the
        player has taken it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MusicUpdate"
            example:
              volume: 25
      responses:
        "200":
          description: Done. The room with its new volume and mute.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicRoom"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/CommandFailed"
        "503":
          $ref: "#/components/responses/Busy"

  /v1/music/{musicId}/play:
    parameters:
