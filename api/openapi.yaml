        Sends every step's commands, in order, and says what happened to each device. Doors and
        gates are pulsed only for keys with the `doors` role and while Door Control is on;
        otherwise they are skipped (`FORBIDDEN`, `DOOR_CONTROL_DISABLED`) and the rest of the scene
        still runs.
